# 全局常量（原 Person/BasalMetabolism/ReviewClock 里魔法数字全部搬来）
# 信号统一 0..1 float。时间: tick=1 游戏分钟, 一天=1440 tick。

[time]
ticks_per_day = 1440

[metabolism]                 # 每 tick 基础 delta（负=下降）; 其余信号缺省 0.0
# 设计: 一天=1440 tick。这是【基准】消耗, 还要乘 昼夜倍率 × 活动倍率
# (见 [energy_rhythm] / [activity])。
hunger = -0.0013888888888888889    # -1/720（半天从满到空）
# energy: 24 小时【基础】消耗 ≈ 50%(0.504)。基准 = -0.00035 ≈ -0.5/1440/tick。
#   白天乘 1.0(基础就是它); 入夜 20:00–22:00 乘 9 → 再掉 ≈38%。
#   合计 24h ≈ 0.84。若想要“24h 基础 60%”就改 -0.0004166…(= -0.6/1440)。
# 注: 睡觉【逐 tick 回满】(bed_basic affordances.energy = 1.0), 满了就提前醒。
energy = -0.00035    # ≈ -0.5/1440 = 24h 基础 ≈50%
# bladder 有【两条】独立的渠道:
#   ① 基础代谢(这里): 时间推移本身就在积累 —— 不吃东西也会尿急
#   ② 吃进去的东西: 消化时按 [bladder].per_hunger 折算成 pending
#      (吃多少转化多少 —— 属于 NPC 自己的消化规则, 不是每个物品各自的数据)
# -1/2304 ≈ 1.6 天从满到空; 配上三餐的跳量 → 每天约 2~3 趟厕所
bladder = -0.00043402777777777777
# 注: bladder 不参与 hp(憋不住不致命), 也不进任何白名单 —— 它只是个需求。

[energy_rhythm]              # energy 消耗的【昼夜倍率】(乘在基准上, 线性插值)
# 设计意图: 白天按【基础速度】稳定消耗(24h 共 60%), 入夜 2 小时再把剩下的
# 40% 一口气掉完 → 自己去睡, 而不是“到点睡觉”的脚本。
#
# 数值: 一天倍率和 = 1200×1 + 120×9 + 120×1 = 2400
#   → 总消耗 = 2400 × 基准(约半条命/天 × 1.67 ≈ 0.84)
# 陡降靠【相邻两个控制点】(1199→1200)做阶跃, 避免线性斜坡提前开掉。
# 控制点 [当天分钟, 倍率]。
points = [
  [0,     1.0],   # 00:00
  [1199,  1.0],   # 19:59 白天 = 基础速度
  [1200,  9.0],   # 20:00 入夜: 阶跃拉满
  [1319,  9.0],   # 21:59 保持 2 小时 → 再掉 40%
  [1320,  1.0],   # 22:00 落回
  [1440,  1.0],   # 24:00 接上 00:00
]

[activity]                   # 在做事时的额外消耗倍数
busy_energy_mul = 1.8        # 交互中 / 赶路中(睡觉除外: 冻结)

[bladder]
convert_per_tick = 0.02        # pending -> 膀胱 的每 tick 转化速率
per_hunger = 0.5               # 消化 1.0 的 hunger → 攒多少 pending(吃多少转化多少)

[knowledge]                    # M5: 知识库
half_life_ticks = 2880        # 2 天(知识半衰期)
# 记忆淡到低于它 → 值得再看一眼(观察是有条件的, 见 Person._need_look)
obs_refresh_below = 0.5

[utility]                      # 决策打分
power = 3.0                    # weight = need**power(幂>1 放大真缺口)
# —— 候选收集不再有门槛: 记忆里的行全部参与打分, 阈值只留在得分上 ——
threshold = 0.05               # 【唯一阈值】低于此分就不行动。
                               # 同时承担“琐碎需求别动”与“别为了小事跑一趟”。
                               # 调大 → 更懒/更少出门; 调小 → 草木皆兵。

# —— 成本模型(比价 / 比距离 / 顺路) ——
# eff = (need^power × value × personality × believe) / (1 + cost_lambda × cost)
# cost = price×qty + price×(1−believe)
# 注: 【走路的时间代价不在这里】—— 它由"净收益"表达(路上需求自己会掉),
#     见 brain.drain_per_tick / _net_value。以前还有个 time_value(走1tick=¥0.05),
#     它把同一次路程罚了两遍、而且罚得不准 —— 已删。
# 注: move_penalty 已删 —— 异地成本由【真实移动 tick】表达。
# 注: 迟滞(preempt_ratio)/plan_pull 已删 —— 手上有事就【做完再决策】,
#     不再每 tick 重算比较; 唯一能打断当前动作的是 PLAN(上班)。
cost_lambda = 0.02             # λ: 成本权重(越大越抠)
# 走路放大系数: 净收益里扣的"路上消耗" = drain × ticks × 这个倍数。
#   1.0 = 纯物理(身体真掉多少就扣多少); 2~3 = 明显的【近距离偏好】。
#   实测(以价值为基准的亏损): 走29tick 8%→16%(K=2)→24%(K=3); 走150tick 42%→83%→100%
#   注意别太大: 扣到 0 就是"那地方根本不考虑" → 该买也不买, 会饿死。
travel_penalty = 2.0

[utility.power_by_signal]      # 每种需求的“钝感”: 越大 → 不到真难受就不动
energy = 4.0                   # 精力要钝一点(默认 3.0): 不太困就别去躺。
                               # 床的分 = (1-精力)^4 × 0.7 —— 精力 0.7 时只有 0.009,
                               # 所以“还没多困就跑回去睡”不会发生。
                               # (幂次越大越钝; 6.0 也试过, 阈值附近太陡)

[motion]                       # 跨地点移动(m5-rectify 13; M7 日程/距离前先入 config)
move_ticks = 30                # ⚠ 基本【不生效】: 只兜底"travel 矩阵里没有这一对";
                               # 编辑器导出的场景会写全所有 pair → 走不到这个分支。
                               # 手写老场景才用得上(那时优先用场景的 travel.default)。
move_m_per_tick = 10.0         # 有路网时: 每 tick 可走米数(等价编辑器 travel 降级的 距离/10)

[health]                       # 生命 = 只有【饥饿】参与(无三态/无回血)
#   一直不吃东西: 3 天后开始掉 hp, 1 天掉完 → 第 4 天 die。
#   (中途吃了饭 hunger>0 → 计数清零, 下次归零重新计)
# 注: 睡眠/精力【不参与 hp】; bladder 也不参与(憋不住不致命)。
# 注: 旧“三态”(归零衰减/吃饱回升/中间带不动)已删。
starve_grace_days = 3.0                  # 满 3 天才开始掉血
hp_decay = 0.0006944444444444444         # 1/1440: 1 天(1440t)把 hp 从 1 掉到 0
hp_override = 0.5                        # hp 低于此 → 日程失去拉力(命比钱大)

[fun]                          # 娱乐: 上班涨 / 空闲掉; 吃/睡/厕所不变
# 不参与 hp, 不是致命需求 —— 只是“闲着会无聊, 去热闹的地方转转”。
idle_drop  = 0.0006944444444444444       # 空闲每 tick 掉 (≈1 天掉光)
work_gain  = 0.0003472222222222222       # 上班每 tick 涨 (≈2 天涨满)
# —— 闲逛的收获(收工时一次结算) ——
#    = roam_value(基础, 出门本身也算消遣)
#    + novel_gain × 本趟【知识增长】Σ(1 − 旧 remember)
#    "知识增长" = 这次看到的东西有多新: 第一次见 = 1/件, 忘了又见 = 1−remember,
#    天天见 ≈ 0。所以【探索本身有回报, 而且会自动收敛】。
roam_value = 0.15                        # 基础回报
novel_gain = 0.10                        # 每单位知识增长补多少
roam_ticks = 60                          # 一次闲逛持续多久 (1 小时; 也是决策周期)
seek_below = 0.6                         # fun 低于此才想闲逛

# —— 闲逛去哪: 想去某地的程度(加权重随, 不是取最大) ——
#    draw = 没去过时的乐观初值 + rich_a×那儿的行数("东西多") + gain_b×上次的收获
#    再 × 距离因子 × 个人抖动(person_id 稳定哈希, 免得认知相同的人扎堆)
optimistic  = 3.0                        # 没去过(连地点行都没有) → 会去一次
visited_base = 0.5                       # 去过就有一点基础权重(空地方不是永不再去)
rich_a      = 2.0                        # 那儿我已知的【行数】值多少
gain_b      = 2.0                        # 那儿上次的【收获】值多少(比"看起来有几行"更可信)
near_lambda = 0.02                        # 距离惩罚(轻 —— 别压死探索)

[work]                         # 上班时的"强制约束"
# 站在工作台上就绑定住了: 只有强需求掉到这个线以下才下来(吃饭/上厕所/困到不行)。
# 其他任何事都夺不走他 —— 否则"在工作"只是又一个候选, 谁都能把他叫走。
# 注: 这不是门禁(不禁止), 只是把"离开工作"的门槛抬高 —— 数据里没有"到点上下班"。
leave_floor = 0.35

[favor]                        # NPC 对【店铺】的好感度(慢变量)
# 语义: 0 = 再也不会去 | 1.0 = 中性(无加成) | 2.0 = 死忠
#   候选打分里乘这个系数 → 好感差就少去/不去。
neutral = 1.0
min = 0.0
max = 2.0
trade_up = 0.02                # 顺利买到东西 → 涨一点
no_service_down = 0.15         # 到店却没人招待(白跑) → 掉得多
spoiled_down = 0.10            # 买到/遇到变质 → 掉
price_lie_down = 0.08          # 看到的价格跟听说的不符 → 掉(对应 SURPRISE/DOUBT)

[economy]                      # 公司经济(最小闭环: 收款进公司账 + 每天发工资)
# 每天【几点】发一次工资(游戏分钟; 480 = 08:00)。变化的是公司的账,
# 不是"NPC 到点去做某事" —— 工资由公司发, 不改任何人的计划(不违反 R1)。
wage_minute = 480

[social]                       # 传播(传闻)
# 一轮传播 = 【说的人】掷一次 + 【听的人】掷一次, 两次都过才搭桥;
# 而且是一对一: 说的人这轮不再听、听的人这轮不再说 ——
# 一个场景里只有“在说的”和“在听的”才配对, 成交率 ≈ tell_p × listen_p。
# 结构上: 同址(同一个 home = 【同一层】, 不是整栋楼)的人常同处 →
#         同屋消息很快对齐; 跨家庭只能靠出门偶遇 →
#         城市自然分成若干“认知不同的家”。
# ★ 2026-09-15 按用户要求: 全部设 1 —— 即【遇到就必然搭桥】(确定性的社会)。
#   代价: 消息会传得非常快(同屋/路人不再有差别), 想要稀疏就把下面的数调小。
tell_p = 1.0                   # 我这一轮想开口的概率(再乘各自的 tell_bias)
listen_p = 1.0                 # 被搭话的人愿不愿意停下来听
# 【跟谁搭话】的权重 —— 关系的第一块: 同屋的人愿意聊, 路人基本不搭话。
# 于是消息主要在家里流动, 陌生人之间很难传开(城市自然分成若干"认知不同的家")。
tell_same_home = 1.0           # 同一个 home(同一层)的人
tell_stranger = 1.0            # 路人(不同 home) —— 也是 1 = 不分亲疏

[stock]                      # 囤货 = 目标存量模型(plan.md §6)
# 语义: 容器【实际存量】属于“家”(共享事实, 会消耗);
#       目标存量属于【个人】(偏好) —— 缺口 → 预期需求 → 提前补货。
# 刻意不做“home 有需求 → 发任务”: 那会造出一个“有需求的组”,
# 而且需要“派给谁”的调度。这里谁最想买谁去。
future_weight = 1.0          # 预期需求在 urgency 里的权重 w
fill = 0.8                   # 囤到“保质期内吃得完的量”的几成
                             #   1.0 = 一直在临期边缘(激进); 小 → 勤买少量新鲜
default_days = 3.0           # 不会坏的东西按几天量囤

# 注意: 【没有 “每种东西囤几个” 的配置】。
# 目标存量 = 每天消耗份数 × 保质期天数 × fill × personality.thrift
#   每天消耗份数 = (-metabolism[sig] × ticks_per_day) / item.value
#   保质期天数   = item.shelf_life_ticks / ticks_per_day
# => 简餐(1 天)只囤 ~0.5 份; 苹果(3 天)囤 ~2.3 份。短保自然囤得少。
