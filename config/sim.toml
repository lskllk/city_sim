# 全局常量（原 Person/BasalMetabolism/ReviewClock 里魔法数字全部搬来）
# 信号统一 0..1 float。时间: tick=1 游戏分钟, 一天=1440 tick。

[time]
ticks_per_day = 1440

[metabolism]                 # 每 tick 基础 delta（负=下降）; 其余信号缺省 0.0
hunger = -0.0006944444444444445    # -1/1440（24h 耗尽）
thirst = -0.001388888888888889     # -1/720 （12h 见底）
energy = -0.00034722222222222224   # -1/2880（48h）
fun    = -0.00034722222222222224   # -1/2880（48h）

[bladder]
convert_per_tick = 0.02        # pending -> 膀胱 的每 tick 转化速率

[review]                       # 重评节律参数
min_ticks = 1                  # 最清醒时每 tick 想一次
max_ticks = 48                 # 最困时约每 48 tick 重评一次

[wake]                         # 生物钟 / 清醒度(brain.circadian/arousal)
peak_hour = 15.0               # 最清醒时刻(h); 谷=峰±12h
circadian_min = 0.15           # 生物钟谷值
circadian_amp = 0.85           # 振幅(峰=min+amp)
energy_floor = 0.4             # 清醒度里 energy 基准系数
energy_gain = 0.6              # 清醒度里 energy 增益
hunger_penalty = 0.2           # 饥饿拖累

[knowledge]                    # M5: 知识库
half_life_ticks = 2880        # 2 天(知识半衰期)

[utility]                      # 决策打分
power = 3.0                    # weight = need**power(幂>1 放大真缺口)
threshold = 0.08               # 低于此分 -> idle
move_penalty = 0.6             # 异地(MoveTo)候选效用折扣(移动有耗时/精力成本)
buy_margin = 1.0               # 愿买度缓冲: willing=clamp01((money-price)/(price*margin))

[motion]                       # 跨地点移动(m5-rectify 13; M7 日程/距离前先入 config)
move_ticks = 30

[health]                       # 生命: 饥饿/饥渴为 0 时下降, 两者满足时回升
hp_decay = 0.0005              # 任一为 0 时 hp 每 tick 下降
hp_regen = 0.0005              # 两者满足时 hp 回升最大速率(×均值)
