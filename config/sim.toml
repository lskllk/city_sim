# 全局常量（原 Person/BasalMetabolism/ReviewClock 里魔法数字全部搬来）
# 信号统一 0..1 float。时间: tick=1 游戏分钟, 一天=1440 tick。

[time]
ticks_per_day = 1440

[metabolism]                 # 每 tick 基础 delta（负=下降）; 其余信号缺省 0.0
# 设计: 一天=1440 tick。这是【基准】消耗, 还要乘 昼夜倍率 × 活动倍率
# (见 [energy_rhythm] / [activity])。
hunger = -0.00023148148148148148   # -1/4320（3 天）
# energy = 【1 天】的存量(不再是 4 天): 基准按 [energy_rhythm] 归一化,
# 让“整整 24 小时不睡刚好耗光 1.0”; 白天只占其中 ~0.38, 夜里 ~0.62。
energy = -0.00050601

[energy_rhythm]              # energy 消耗的【昼夜倍率】(乘在基准上, 线性插值)
# 设计意图: 白天慢、夜里快 —— 夜里掉得快 → 困 → 去睡,
# 而不是“到点睡觉”的脚本(数据里不出现 时刻→行为)。
# 控制点 [当天分钟, 倍率]: 00:00=0, 05:30=330, 07:00=420, 18:00=1080, 21:00=1260, 24:00=1440
points = [
  [0,    2.6],   # 深夜还醒着 → 掉得最快
  [330,  2.4],   # 05:30 还没睡 → 依旧很快
  [420,  0.75],  # 07:00 起床后 → 慢
  [1080, 0.7],   # 18:00 白天最慢
  [1260, 1.3],   # 21:00 开始变快
  [1440, 2.6],   # 回到深夜
]

[activity]                   # 在做事时的额外消耗倍数
busy_energy_mul = 1.8        # 交互中 / 赶路中(睡觉除外: 冻结)

[bladder]
convert_per_tick = 0.02        # pending -> 膀胱 的每 tick 转化速率

[knowledge]                    # M5: 知识库
half_life_ticks = 2880        # 2 天(知识半衰期)

[utility]                      # 决策打分
power = 3.0                    # weight = need**power(幂>1 放大真缺口)
# —— 候选收集不再有门槛: 记忆里的行全部参与打分, 阈值只留在得分上 ——
threshold = 0.05               # 【唯一阈值】低于此分就不行动。
                               # 同时承担“琐碎需求别动”与“别为了小事跑一趟”。
                               # 调大 → 更懒/更少出门; 调小 → 草木皆兵。

# —— 成本模型(比价 / 比距离 / 顺路) ——
# eff = (need^power × value × personality × believe) / (1 + cost_lambda × cost)
# cost = price×qty + time_value×travel_ticks + price×(1−believe)
# 注: move_penalty 已删 —— 异地成本由【真实移动 tick】表达。
cost_lambda = 0.02             # λ: 成本权重(越大越抠)
time_value  = 0.05             # 走 1 tick 折合多少钱(决定“顺路”值多少)

[motion]                       # 跨地点移动(m5-rectify 13; M7 日程/距离前先入 config)
move_ticks = 30                # 无路网时的固定耗时(MoveTo 降级)
move_m_per_tick = 10.0         # 有路网时: 每 tick 可走米数(等价编辑器 travel 降级的 距离/10)

[health]                       # 生命【三态】
#   ↓  hunger==0 或 energy==0
#   ↑  hunger ≥ hp_regen_floor 且 energy ≥ hp_regen_floor
#   不动  中间带(否则咬一口饭 hp 就开始涨 => “饿死”永远发生不了)
# 注: bladder 不参与 hp(憋不住不致命)。
hp_decay = 0.00034722222222222222        # 1/2880: 归零后约 2 天掉光 hp
hp_regen = 0.00034722222222222222        # 回升最大速率(× 饱食/精力的均值)
hp_regen_floor = 0.5                     # “吃饱/睡够”的阀值
hp_override = 0.5                        # hp 低于此 → 日程失去拉力(命比钱大)

[social]                       # 传播(传闻)
# 空闲时开口告诉同地别人一件事的概率(再乘各自的 tell_bias)。
# 0 = 不说话(纯感知社会); 太大 = 全城瞬间都知道。
# 结构上: 同址(同一 home)的人常同处 → 家庭内部消息很快对齐;
#         跨家庭只能靠出门偶遇 → 城市自然分成若干“认知不同的家”。
tell_p = 0.3
