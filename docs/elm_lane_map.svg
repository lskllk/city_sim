<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620">
  <title>榆树巷 · Elm Lane 街区地图</title>
  <defs>
    <style>
      .bg { fill:#0f1117; }
      .room { fill:#181c26; stroke:#39415a; stroke-width:1.5; rx:12; }
      .home { stroke:#3b5bdb; }
      .hub  { stroke:#e6c04a; stroke-width:2.5; }
      .title { fill:#9fd1ff; font:bold 15px system-ui; }
      .ic    { font:20px system-ui; }
      .lab   { fill:#b7c0d4; font:11px system-ui; }
      .dim   { fill:#7a8296; font:10px system-ui; }
      .dist  { fill:#e6c04a; font:bold 13px system-ui; }
      .sale  { fill:#e8890c; font:11px system-ui; }
      .link  { stroke:#4a5568; stroke-width:2; }
      .cash  { fill:#8ce99a; font:11px system-ui; }
    </style>
  </defs>
  <rect class="bg" width="1080" height="620"/>
  <text x="24" y="40" class="title" font-size="20">榆树巷 · 一个街区</text>
  <text x="24" y="60" class="dim">广场是枢纽：家 4~5t 到 · 食堂便宜但有饭点 · 便利店贵但全天 · 超市最便宜但远(34t)——省钱/省时/随时，选两个</text>

  <!-- ============ 左列：家 ============ -->
  <!-- 王二家 -->
  <rect class="room home" x="16" y="84" width="170" height="104"/>
  <text x="30" y="106" class="title">王二家</text>
  <text x="30" y="132" class="ic">🛏</text><text x="56" y="132" class="ic">🚽</text>
  <text x="82" y="132" class="ic">🧊</text><text x="108" y="138" class="lab">4</text>
  <text x="134" y="132" class="ic">📺</text>
  <text x="30" y="160" class="dim">冰箱 4 份 · 家</text>

  <!-- 李四家 -->
  <rect class="room home" x="16" y="216" width="170" height="104"/>
  <text x="30" y="238" class="title">李四家</text>
  <text x="30" y="264" class="ic">🛏</text><text x="56" y="264" class="ic">🚽</text>
  <text x="82" y="264" class="ic">🧊</text><text x="108" y="270" class="lab" fill="#ff7a7a">空</text>
  <text x="30" y="292" class="dim">冰箱空 → 靠外部</text>

  <!-- 合租房 -->
  <rect class="room home" x="16" y="380" width="170" height="120"/>
  <text x="30" y="402" class="title">合租房</text>
  <text x="30" y="428" class="ic">🛏</text><text x="56" y="428" class="ic">🛏</text>
  <text x="82" y="428" class="ic">🚽</text><text x="108" y="428" class="ic">🧊</text><text x="134" y="434" class="lab">2</text>
  <text x="30" y="460" class="dim">张三 · 赵五 同房争厕/抢冰箱</text>

  <!-- ============ 顶行：商铺 ============ -->
  <!-- 24h便利店 -->
  <rect class="room" x="220" y="84" width="210" height="120"/>
  <text x="234" y="106" class="title">24h 便利店</text>
  <text x="234" y="134" class="ic">🍱</text><text x="258" y="134" class="lab">6</text>
  <text x="285" y="136" class="cash">¥12</text>
  <text x="234" y="162" class="lab">🕒 全天</text>
  <text x="234" y="180" class="dim">随时可得（贵）</text>

  <!-- 巷口食堂 -->
  <rect class="room" x="452" y="84" width="240" height="120"/>
  <text x="466" y="106" class="title">巷口食堂</text>
  <text x="466" y="134" class="ic">🍱</text><text x="490" y="134" class="lab">40</text>
  <text x="517" y="136" class="cash">¥6</text>
  <text x="466" y="162" class="lab">🕒 06-09 · 11-14 · 17-20</text>
  <text x="466" y="180" class="dim">便宜但有饭点（3 段）</text>

  <!-- 大超市 -->
  <rect class="room" x="714" y="84" width="250" height="120"/>
  <text x="728" y="106" class="title">大超市</text>
  <text x="728" y="134" class="ic">🍱</text><text x="752" y="134" class="lab">200</text>
  <text x="779" y="136" class="cash">¥4</text>
  <text x="728" y="162" class="lab">🕒 08-21</text>
  <text x="728" y="180" class="dim">最便宜，但 34t 远</text>

  <!-- ============ 街心广场(枢纽) ============ -->
  <rect class="room hub" x="220" y="330" width="330" height="180"/>
  <text x="238" y="352" class="title">街心广场 · 枢纽</text>
  <text x="238" y="382" class="ic">🪑</text><text x="264" y="382" class="ic">🪑</text>
  <text x="290" y="382" class="ic">🚰</text>
  <text x="238" y="410" class="lab">社交 / 娱乐 / 路过 / 传闻</text>
  <text x="238" y="434" class="dim">所有家 4~5t 即到 · 传闻汇聚点</text>

  <!-- 公厕 -->
  <rect class="room" x="600" y="330" width="150" height="96"/>
  <text x="614" y="352" class="title">公厕</text>
  <text x="614" y="384" class="ic">🚽</text>
  <text x="614" y="406" class="dim">广场待久必专程跑 → 离场</text>

  <!-- 棋牌室 -->
  <rect class="room" x="782" y="330" width="180" height="120"/>
  <text x="796" y="352" class="title">棋牌室</text>
  <text x="796" y="384" class="ic">🀄</text>
  <text x="796" y="410" class="lab">🕒 10-23</text>
  <text x="796" y="428" class="dim">乐子 / 传闻目标</text>

  <!-- 工地 -->
  <rect class="room" x="782" y="500" width="180" height="96"/>
  <text x="796" y="522" class="title">工地</text>
  <text x="796" y="552" class="ic">🔨</text>
  <text x="796" y="576" class="lab" fill="#7a8296">08-18 · 待经济系统</text>

  <!-- ============ 连线与距离 ============ -->
  <!-- 家→广场 -->
  <path class="link" d="M186 136 L220 136"/>
  <path class="link" d="M186 268 L220 268"/>
  <path class="link" d="M186 440 L220 440"/>
  <!-- 广场→便利店 -->
  <path class="link" d="M360 330 L360 204"/>
  <text x="366" y="270" class="dist">6t</text>
  <!-- 广场→食堂 -->
  <path class="link" d="M500 330 L500 204"/>
  <text x="508" y="270" class="dist">10t</text>
  <!-- 广场→超市(长) -->
  <path class="link" d="M700 380 L839 380"/>
  <text x="742" y="372" class="dist">34t</text>
  <!-- 广场→公厕 -->
  <path class="link" d="M600 366 L620 360"/>
  <text x="612" y="352" class="dist">5t</text>
  <!-- 广场→棋牌室 -->
  <path class="link" d="M782 400 L836 400"/>
  <text x="806" y="392" class="dist">12t</text>
  <!-- 食堂→超市 -->
  <path class="link" d="M692 144 L714 144"/>
  <text x="696" y="136" class="dist">22t</text>
  <!-- 食堂→棋牌室 -->
  <path class="link" d="M692 180 L796 300"/>
  <!-- 工地→超市 -->
  <path class="link" d="M839 500 L839 204"/>
  <text x="846" y="360" class="dist">12t</text>

  <!-- 图例 -->
  <text x="24" y="540" class="lab">图例</text>
  <text x="30" y="562" class="ic">🧊</text><text x="58" y="564" class="lab">冰箱库存 · 稀缺缓冲：王二4/合租2/李四0 → 三种生活方式</text>
  <text x="30" y="584" class="ic">🍱</text><text x="58" y="586" class="lab">食源 · ¥=价格(展示元数据，经济系统暂缓)</text>
  <text x="30" y="604" class="ic">🔨</text><text x="58" y="606" class="lab">工地 = 空间节点(占位)，08-18 营业时段待经济模块</text>
</svg>
