<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>原型 · 城市与交互</title>
<!--
  ============================================================================
  ❄ 设计已冻结 · 这是【参考实现】                                       2026-09
  ----------------------------------------------------------------------------
  实现依据 = docs/ui-spec.md（精确数值 / 组件清单 / 交互表 / 占位清单）
  设计理由 = docs/ui-design.md（什么该给玩家看）· docs/art-direction.md（美术）
  这份文件的作用：**看得见摸得着的标准答案**。实现时有歧义，以它为准。

  怎么用：
    · 每个可点的东西都带 data-t="bld|item|npc"  → 对应 ui-spec 的组件编号
    · 所有【占位内容】都标了 ⟦占位⟧ —— 那是留给美术/内容的地方，见 §8 占位清单
    · 所有【演示数据】都在 seed() 里 —— 那是为了让原型能跑，不是设计要求

  主画面 = 全屏 2D 城市地图（连续空间）+ 四角 HUD
  详情页 = 前图层 · 不透明 · 居中 · 背后虚化 · 打开即暂停

  本版新增（需求 1-7）：
    ① 物品交互      货架/床/马桶…点它们出气泡; 动作按【到不到得了】+【是不是我的】给
    ② 设置         右上角: 显示(缩放/渲染倍率/帧率/全屏) + 游戏(自动生理/显示路径)
    ③ 存档         右上角: 3 槽位 localStorage + 导出/导入 JSON
    ④ 连续空间导航  点任意地方 → A* 寻路走过去（建筑要【走门口】）
    ⑤ 交互气泡      挂在目标的世界坐标上 → 拖动/缩放地图时**跟着走**
    ⑥ 室内 + 屋顶LOD 走进去 → 屋顶淡出看到室内; 相机拉远 → 屋顶变回不透明
    ⑦ 人物占位      不再用圆点, 改成 2D 画风的人物占位（美术可直接替换）

  信息设计不变（见 docs/ui-design.md）：
    每条情报带【来源 + 时间 + 精度档】, 旧的褪色; 笔记本永不自动刷新;
    快进摘要故意不全; 账本按「多久没来」排。
  ============================================================================
-->
<style>
:root{
  --paper:#f7f4ee; --paper2:#efebe1; --paper3:#e6e0d2;
  --ink:#26221c;   --ink2:#7a7264;   --line:#ded7c8;
  --hi:#b4552d;    --ok:#4a7358;     --warn:#9b6f16;
  --ui:1;                       /* 界面缩放 */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#6d8a52;color:var(--ink);
  font:13px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums}
.dim{color:var(--ink2)}
.hr{height:1px;background:var(--line);margin:9px 0}
.warn{color:var(--warn)} .bad{color:var(--hi)}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:10px;
  border:1px solid var(--line);color:var(--ink2)}
.tag.b{border-color:#9fb6c4;color:#3a6270}
.tag.c{border-color:#d3bb8e;color:#8a6420}

/* ══════════════════════ 地图：视口 + 世界层 ══════════════════════ */
#viewport{position:fixed;inset:0;overflow:hidden;background:#6d8a52;cursor:crosshair}
/* ★ 这里【绝对不能】写 will-change:transform。
   它会把这层栅格化成一张 GPU 纹理缓存起来；之后放大只是把那张纹理拉大,
   浏览器不重画 → 小字（物品名 10px、气泡 11-13px）全糊。
   指纹: 【放大变糊、缩小没事】—— 因为缩小是缩小采样。
   去掉它, 浏览器每次改 transform 会按新缩放重新栅格化 → 放大反而更锐。 */
#world{position:absolute;left:0;top:0;width:2048px;height:1408px;
  transform-origin:0 0}
#world .ground{position:absolute;inset:0;background-color:#6d8a52;
  background-image:
    repeating-linear-gradient(45deg,#ffffff09 0 2px,transparent 2px 7px),
    repeating-linear-gradient(-45deg,#0000000a 0 2px,transparent 2px 7px)}
#world .road{position:absolute;background:#4c4a4a;overflow:hidden;
  box-shadow:inset 0 0 0 3px #b8b3a6, 0 2px 5px #0000001f}
#world .road.h::after,#world .road.v::after{content:"";position:absolute;opacity:.55}
#world .road.h::after{left:0;right:0;top:50%;height:3px;transform:translateY(-1.5px);
  background:repeating-linear-gradient(90deg,#e9e5da 0 20px,transparent 20px 38px)}
#world .road.v::after{top:0;bottom:0;left:50%;width:3px;transform:translateX(-1.5px);
  background:repeating-linear-gradient(0deg,#e9e5da 0 20px,transparent 20px 38px)}
#world .tree{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 34% 30%,#5f8f52 0 42%,#4f7a45 43% 72%,#3d6236 73%);
  box-shadow:2px 3px 0 #0000001f,inset 0 0 0 1px #00000018}
#world .car{position:absolute;border-radius:3px;transform:translate(-50%,-50%);
  box-shadow:inset 0 0 0 1px #00000024,1px 2px 0 #00000018}

/* 建筑：外壳(屋顶) + 室内(地板+家具)。走进去时屋顶淡出 */
#world .bld{position:absolute;border-radius:3px;cursor:pointer;z-index:2}
#world .bld .floor{position:absolute;inset:5px;border-radius:2px;
  background:var(--floor,#e8dfc9);box-shadow:inset 0 0 0 1px #00000022}
#world .bld .roof{position:absolute;inset:0;border-radius:3px;background:var(--roof,#8c5b48);
  box-shadow:4px 5px 0 #0000001a,inset 0 0 0 1px #00000033,inset 0 -5px 0 #00000022;
  transition:opacity .28s}
#world .bld .roof::before{content:"";position:absolute;inset:2px 2px 5px;border-radius:2px;
  opacity:.22;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 8px)}
#world .bld .roof::after{content:"";position:absolute;left:var(--door,46%);bottom:-4px;
  width:15px;height:9px;background:#5a4a3c;border-radius:0 0 2px 2px;
  box-shadow:0 0 0 1px #00000030}
#world .bld .lits{position:absolute;inset:7px 7px 9px;opacity:0;transition:opacity 1.2s;
  background-image:radial-gradient(#ecc579 1.4px,transparent 1.6px);
  background-size:12px 10px;background-position:2px 3px;pointer-events:none}
body.night #world .bld .lits{opacity:.85}
#world .bld.home{--roof:#7a6a5a;--floor:#e6dcc6}
/* ★ 知识地图: 没进去过 = 近乎黑白; 记旧了 = 泛黄; 新鲜 = 全彩
   （名称仍然照给 —— 那是常识; 褪色表达的是"我对这里面知道多少"） */
#world .bld.lv0 .roof{filter:saturate(.12) brightness(1.07)}
#world .bld.lv0 .floor{filter:saturate(.12) brightness(1.07)}
#world .bld.lv1 .roof{filter:saturate(.5) sepia(.28) brightness(1.04)}
#world .bld.lv1 .floor{filter:saturate(.6) sepia(.2)}
/* ══════════ L6 标注层：屏幕空间覆盖层 ══════════
   ★ 文字【不进 #world】。只要文字在缩放容器里, 就得依赖浏览器的栅格化策略 ——
     配上 will-change / 大图层缓存, 放大就变成"拉伸纹理"→糊。
     搬到这里后文字永远是 1:1: 任何缩放都锐, 而且 .bub 的 scale(1/k) hack 可以删掉。
   位置每帧用世界→屏幕投影算(见 w2s), 所以拖动/缩放时仍然"跟着目标走"。
   z-index 5 = 地图之上、四角 HUD(10) 之下。 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
#labels>*{position:absolute;left:0;top:0}
/* 宿主元素只管【位置】（内联 transform）；居中锚点也在内联里一起给 ——
   否则 CSS 里的 translate(-50%) 会被内联 transform 覆盖掉。见 syncLabels 的 ANCHOR[]。 */
#labels .lname{white-space:nowrap}

/* 名牌（纸片）—— 没去过就只给一个"？" */
#labels .plate{display:inline-block;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  padding:2px 6px;white-space:nowrap;pointer-events:none;
  box-shadow:0 1px 3px #00000014;font-size:11px;line-height:1.3}
#labels .plate .nm{font-weight:600}
#labels .plate.lv0{border-style:dashed;color:#9d968a;font-size:10px}
#labels .plate.lv1{background:#f3ecdc}
.plate .nodata{display:inline-block;width:46px;height:7px;border-radius:4px;
  border:1px dashed #cfc7b6;margin-left:5px;vertical-align:middle}
/* ★ 精度 = 区间条: 精准 = 一个点, 模糊 = 一段越来越宽的带 */
#world .pv,.sheet-bd .pv{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
#world .pv .tr,.sheet-bd .pv .tr{position:relative;width:46px;height:7px;border-radius:4px;
  background:linear-gradient(90deg,#00000010,#00000006);box-shadow:inset 0 0 0 1px #00000012}
#world .pv .tr i,.sheet-bd .pv .tr i{position:absolute;top:1px;bottom:1px;border-radius:3px;
  background:var(--ink2)}
#world .pv.p5 .tr i,.sheet-bd .pv.p5 .tr i{background:var(--ok)}
#world .pv.p2 .tr i,#world .pv.p1 .tr i,
.sheet-bd .pv.p2 .tr i,.sheet-bd .pv.p1 .tr i{background:#b9b2a4}
#world .pv b,.sheet-bd .pv b{font-family:ui-monospace,Consolas,monospace;font-size:12px}
#world .pv .approx,.sheet-bd .pv .approx{color:var(--ink2);font-size:10px}
/* 来源只给一个记号，不再给"亲眼/打听"这些字 */
.si{font-weight:700;font-size:10px}
.si.A{color:var(--ok)} .si.B{color:#3a6270} .si.C{color:#8a6420}
.si.D{color:#a8761c} .si.E{color:#6b6153}
/* ═══════ 当前动作 + 行动队列（左上角，状态下面）═══════
   ① 只有【正在做】那一条有进度条 —— 一眼看出你在干什么、做到哪了
   ② 队列用【序号】，不是项目符号 —— 它是有顺序的计划
   ③ 点一下 = 排队（不是立即打断）；Shift+点 = 插到队首
   ④ 队列在地图上画成带编号的路点 —— 你能"看见自己的一天"
   ═════════════════════════════════════════════════════ */
#paneMe .actwrap{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.actwrap .none{font-size:11px;color:var(--ink2)}
.now{display:flex;align-items:center;gap:7px}
.now .ic{width:14px;height:14px;flex:0 0 auto;color:var(--ink)}
.now .lb{flex:1;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.now .x,.qi .x{flex:0 0 auto;width:18px;height:18px;border-radius:50%;color:var(--ink2);
  font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.now .x:hover,.qi .x:hover{background:#00000010;color:var(--hi)}
.prog{height:3px;border-radius:2px;background:#00000012;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--hi);border-radius:2px;
  transition:width .12s linear}
.queue{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.queue .qh{font-size:10px;color:var(--ink2);letter-spacing:.05em;margin-bottom:5px}
.qi{display:flex;align-items:center;gap:7px;padding:3px 0;border-radius:5px}
.qi:hover{background:#00000006}
.qi .no{width:13px;height:13px;flex:0 0 auto;border-radius:50%;border:1.2px solid #b9b2a4;
  font-size:9px;line-height:11px;text-align:center;color:var(--ink2)}
.qi .ic{width:13px;height:13px;flex:0 0 auto;color:var(--ink2)}
.qi .lb{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi.done .lb{text-decoration:line-through;color:var(--ink2)}
.qi.done{opacity:.5}
.qi.next .no{border-color:var(--ink);color:var(--ink);font-weight:700}
/* 队列在地图上的编号标记 */
#world .qmark{position:absolute;width:17px;height:17px;border-radius:50%;
  transform:translate(-50%,-50%);z-index:9;pointer-events:none;
  background:#f7f4eee8;border:1.4px solid var(--ink2);color:var(--ink2);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
#world .qmark.now{border-color:var(--hi);color:var(--hi);box-shadow:0 0 0 3px #b4552d22}

/* 我的家：外墙暖一点 + 同一条强调描边（和店铺一样"是你的"） */
#world .bld.minehome{--roof:#8a6a4e;--floor:#ecdfc6}
/* 家里东西的卡片 */
.homebar{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;background:#fff}
.homebar.out{background:#f7f4ee;border-style:dashed}
.homebar .ic{color:var(--ink2)}
.homebar .t{flex:1;font-weight:600}
.homebar button{padding:4px 12px;border:1px solid var(--ink2);border-radius:999px;font-size:12px}
.homebar button:hover{background:var(--ink);color:var(--paper)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hitem{display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid var(--line);border-radius:9px;background:#fff;padding:13px 8px 11px;
  cursor:pointer;transition:transform .14s ease-out,box-shadow .14s ease-out}
.hitem:hover{transform:translateY(-3px);box-shadow:0 8px 18px #00000022;border-color:var(--ink2)}
.hitem .hi{width:26px;height:26px;color:var(--ink);margin-bottom:3px}
.hitem .hi svg{width:26px;height:26px}
.hitem .hn{font-weight:600;font-size:13px}
.hitem .hd{font-size:11px;color:var(--ink2)}
.hitem .hm{font-size:10px;color:var(--ink2);margin-top:4px;
  font-family:ui-monospace,Consolas,monospace}
.hitem.far{opacity:.62;border-style:dashed}
.hitem.far:hover{opacity:1}

/* 需求徽章（头顶） */
#labels .badge{width:16px;height:16px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;box-shadow:0 1px 3px #0003,0 0 0 1px #00000014}
#labels .badge.hesit{background:#ffedcc}
#world .bld.factory{--roof:#6b7176;--floor:#d9d6cf}
#world .bld.mine{outline:2px solid var(--hi);outline-offset:1px}

/* 物品（家具 / 货） */
#world .item{position:absolute;z-index:6;border-radius:3px;transform:translate(-50%,-50%);
  cursor:pointer;box-shadow:0 0 0 1px #00000033,1px 2px 0 #0000001f;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#0009;font-weight:600}
#world .item:hover{box-shadow:0 0 0 2px var(--hi),1px 2px 0 #0000002a}
#world .item.goods{background:#d9b06a}
#world .item.fixture{background:#a9a396}
#world .item.food{background:#cb8f66}
/* 物品名是【写在物件上】的, 所以它随地图缩放。缩到看不清就整体不画, 别留糊字。 */
#world .item.lbl-off{color:transparent}
#world .item.bed{background:#8d9db0}

/* 人物占位（2D 画风；美术换成 SpriteSheet） */
#world .person{position:absolute;z-index:8;transform-origin:50% 100%;pointer-events:auto;cursor:pointer}
#world .person svg{display:block;filter:drop-shadow(1px 2px 0 #00000026)}
#world .person.me{cursor:default}
#labels .nm{display:inline-block;
  background:#f7f4eee8;border:1px solid #ded7c8;border-radius:4px;padding:0 4px;
  font-size:10px;font-weight:600;white-space:nowrap;color:#26221c}
#world .person.sel svg{filter:drop-shadow(0 0 0 var(--hi)) drop-shadow(0 0 4px var(--hi))}

/* 导航路径 */
#world .path{position:absolute;inset:0;z-index:9;pointer-events:none}
#world .path i{position:absolute;width:4px;height:4px;border-radius:50%;
  background:#b4552daa;transform:translate(-50%,-50%)}

/* 世界坐标上的交互气泡（拖动地图会跟着走）*/
#labels .bub{pointer-events:auto;position:absolute;transform-origin:50% 100%;z-index:50;
  background:var(--paper);border:1px solid var(--line);border-radius:9px;
  box-shadow:0 8px 26px #0003;padding:9px 11px;min-width:190px;max-width:270px;cursor:default}
#labels .bub .t{font-weight:700;font-size:13px}
#labels .bub .sub{font-size:11px;color:var(--ink2);margin-top:1px}
#labels .bub .info{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:11px}
#labels .bub .info .r{display:flex;justify-content:space-between;gap:8px}
#labels .bub .acts{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
#labels .bub .acts button{padding:4px 10px;border:1px solid var(--ink2);border-radius:999px;font-size:11px}
#labels .bub .acts button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
#labels .bub .acts button:disabled{opacity:.42;cursor:not-allowed;border-style:dashed}
#labels .bub .why{font-size:10px;color:var(--warn);margin-top:5px}
#labels .bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;
  width:11px;height:11px;background:var(--paper);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);transform:rotate(45deg)}
#night{position:fixed;inset:0;pointer-events:none;z-index:2;background:#0d2340;
  mix-blend-mode:multiply;opacity:0;transition:opacity 1.6s}
#rain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s}
#rain.on{opacity:.18;background:repeating-linear-gradient(104deg,#20456b 0 1px,transparent 1px 6px)}

/* ══════════════════════ 四角 HUD ══════════════════════ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;
  font-size:calc(13px * var(--ui))}
#hud>*{pointer-events:auto}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.tl{position:absolute;left:16px;top:16px;width:calc(198px * var(--ui))}
.tc{position:absolute;left:50%;top:14px;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;padding:7px 15px;border-radius:999px}
.bc{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px}
.tr{position:absolute;right:16px;top:16px;display:flex;gap:8px;align-items:flex-start}
.br{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
.me-name{font-size:11px;color:var(--ink2);margin-bottom:6px}
.me-money{font-size:20px;font-weight:700}
.me-money .d{font-size:11px;font-weight:400;margin-left:6px}
.bars{margin-top:9px;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:26px 1fr 26px;align-items:center;gap:7px;font-size:11px}
.bar .t{height:4px;background:var(--paper3);border-radius:2px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--ink2);border-radius:2px}
.bar.low .t i{background:var(--hi)}
.bar .v{text-align:right;color:var(--ink2)}
.bar .auto{color:var(--hi);font-weight:700}
.tc .day{font-weight:700}
.tc .clock{font-weight:600}
.tc .sep{width:1px;height:14px;background:var(--line)}
.tc .wx{display:flex;align-items:center;gap:5px}
.tc .wx .ic{font-size:15px;line-height:1;color:var(--ink2)}
.tc .temp{color:var(--ink2)}
.bc button{min-width:38px;height:30px;border-radius:999px;font-size:12px;color:var(--ink2)}
.bc button:hover{background:var(--paper2);color:var(--ink)}
.bc button.on{background:var(--ink);color:var(--paper)}
.bc .ff{width:auto;padding:0 13px;font-weight:600}
.entry{display:flex;align-items:center;gap:8px;padding:9px 15px;background:var(--paper);
  border:1px solid var(--line);border-radius:9px;font-weight:600}
.entry:hover{border-color:var(--ink2)}
.entry .ic{width:16px;text-align:center;color:var(--ink2)}
.entry .n{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--paper3);
  color:var(--ink2);font-size:11px;display:flex;align-items:center;justify-content:center}
.entry.hot .n{background:var(--hi);color:#fff}
#surprise{position:absolute;left:50%;top:70px;transform:translateX(-50%);
  max-width:min(430px,80vw);display:none;border-color:var(--hi);box-shadow:0 6px 22px #0002}
#surprise .t{font-weight:700;color:var(--hi);font-size:12px;margin-bottom:3px}

function pathLen(path,from){
  let s=0; for(let i=from;i<path.length-1;i++) s+=Math.hypot(path[i+1].x-path[i].x,path[i+1].y-path[i].y);

/* ==========================================================================
   1. 导航：16px 网格 + A*（建筑要【走门口】）
   ========================================================================== */
const GW=Math.ceil(W/CELL), GH=Math.ceil(H/CELL);
const NAV=new Uint8Array(GW*GH);            // 1 = 可走
const inBldAt=(px,py)=>BLD.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);
/* ★ 可见范围 = 「我在场」。决定 #10: 逻辑上"谁跟谁能说话" = 同一地点。
     我在那栋楼里 && 他也在那栋楼     → 看得见
     我俩都在外面(他在路上走)         → 看得见
     他在楼里而我在外面               → **看不见**（别人家里谁在干嘛, 你不知道）
   例外: 只有【地图骨架 + 建筑名称】对玩家全可见 —— 那是常识, 不是观察。 */
const inTransit=n=>!!(n.path&&n.pi<n.path.length-1);
const locOf=n=>n.at||sched(n.id,now).loc;      // 第一 tick 前 n.at 还是 null → 用日程兜底
function canSee(n){
  if(inTransit(n)) return true;                // 走在街上 → 谁都看得见
  return !!(ME.inside && locOf(n)===ME.inside); // 同一栋楼才看得见
}
// 门口: 南墙上的一个缺口（每栋楼固定，和 .roof::after 的 --door 对应）
const DOOR={};
for(const b of BLD) DOOR[b.id]=b.x + b.w*(b.mine?.46:.5);

(function buildNav(){
  NAV.fill(1);
  for(const b of BLD){
    if(!b.open){                                  // 实心楼：整块不可走
      for(let gy=Math.floor(b.y/CELL);gy<=Math.floor((b.y+b.h)/CELL);gy++)
        for(let gx=Math.floor(b.x/CELL);gx<=Math.floor((b.x+b.w)/CELL);gx++) NAV[gy*GW+gx]=0;
      continue;
    }
    // 有室内的楼：四壁不可走，但【南墙留门口】，室内可走
    const gx0=Math.max(0,Math.floor(b.x/CELL)), gx1=Math.min(GW-1,Math.floor((b.x+b.w)/CELL));
    const gy0=Math.max(0,Math.floor(b.y/CELL)), gy1=Math.min(GH-1,Math.floor((b.y+b.h)/CELL));
    for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++){
      const edge = (gx===gx0||gx===gx1||gy===gy0||gy===gy1);
      if(!edge){ NAV[gy*GW+gx]=1; continue; }
      NAV[gy*GW+gx]=0;
    }
    // 南墙门口开口（含墙外一格，方便进出）
    const dgx=Math.floor(DOOR[b.id]/CELL);
    NAV[gy1*GW+dgx]=1;
    NAV[Math.min(GH-1,gy1+1)*GW+dgx]=1;
    NAV[gy1*GW+Math.max(0,dgx-1)]=1; NAV[gy1*GW+Math.min(GW-1,dgx+1)]=1;
  }
})();
const cellFree=(gx,gy)=> gx>=0&&gy>=0&&gx<GW&&gy<GH&&NAV[gy*GW+gx]===1;
function nearestFree(px,py){
  let gx=Math.min(GW-1,Math.max(0,Math.round(px/CELL))),
      gy=Math.min(GH-1,Math.max(0,Math.round(py/CELL)));
  if(cellFree(gx,gy)) return [gx,gy];
  for(let r=1;r<40;r++)
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.abs(dx)!==r&&Math.abs(dy)!==r) continue;
      if(cellFree(gx+dx,gy+dy)) return [gx+dx,gy+dy];
    }
  // 兜底: 全网格扫——★ 少了这一步, 目标落在实心楼里时路径会穿墙
  let best=[gx,gy], bd=Infinity;
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++)
    if(NAV[y*GW+x]){ const d=(x-gx)*(x-gx)+(y-gy)*(y-gy); if(d<bd){bd=d;best=[x,y];} }
  return best;
}
/* A*（8 向，禁止穿角） */
function findPath(px0,py0,px1,py1){
  const [sx,sy]=nearestFree(px0,py0), [ex,ey]=nearestFree(px1,py1);
  if(sx===ex&&sy===ey) return [{x:sx*CELL,y:sy*CELL}];
  const N=GW*GH, g=new Float32Array(N).fill(Infinity), from=new Int32Array(N).fill(-1);
  const h=(x,y)=>Math.hypot(x-ex,y-ey);
  const open=[[h(sx,sy),sx,sy]], seen=new Uint8Array(N);
  const si=sy*GW+sx, ei=ey*GW+ex; g[si]=0;
  while(open.length){
    open.sort((a,b)=>a[0]-b[0]);
    const [,x,y]=open.shift(); const i=y*GW+x;
    if(seen[i]) continue; seen[i]=1;
    if(i===ei) break;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nx=x+dx, ny=y+dy; if(!cellFree(nx,ny)) continue;
      if(dx&&dy&&(!cellFree(x+dx,y)||!cellFree(x,y+dy))) continue;   // 不穿角
      const ni=ny*GW+nx, ng=g[i]+(dx&&dy?1.414:1);
      if(ng<g[ni]){ g[ni]=ng; from[ni]=i; open.push([ng+h(nx,ny),nx,ny]); }
    }
  }
  if(from[ei]<0 && si!==ei) return [];
  const out=[]; let i=ei;
  while(i>=0){ out.push({x:(i%GW)*CELL, y:Math.floor(i/GW)*CELL}); if(i===si) break; i=from[i]; }
  out.reverse();
  // 终点对齐到真实点击位置 —— 但【只在那一格可走时】, 否则点到实心楼里会穿墙
  if(out.length){
    const tx=Math.round(px1/CELL), ty=Math.round(py1/CELL);
    if(cellFree(tx,ty)) out[out.length-1]={x:px1,y:py1};
  }
  return out;
}

/* ==========================================================================
   2. 相机 + 坐标
   ========================================================================== */
function camApply(){
  document.getElementById("world").style.transform=
    `translate(${-cam.x*cam.k}px,${-cam.y*cam.k}px) scale(${cam.k})`;
}
function viewSize(){ const r=viewportEl.getBoundingClientRect(); return {w:r.width,h:r.height}; }
function camClamp(){
  const {w,h}=viewSize();
  const vw=w/cam.k, vh=h/cam.k;
  cam.x=Math.min(Math.max(cam.x,-120), Math.max(0,W-vw)+120);
  cam.y=Math.min(Math.max(cam.y,-120), Math.max(0,H-vh)+120);
}
function camCenterOn(px,py){
  const {w,h}=viewSize(); cam.x=px-w/cam.k/2; cam.y=py-h/cam.k/2; camClamp(); camApply();
}
/* 世界 → 屏幕(client)坐标。标注层用它定位。
   #world 的 transform = translate(-cam*k) scale(k) →
   viewport 内 = (world - cam) * k，再加 viewport 自己的页面偏移 */
function w2s(wx,wy){
  const r=viewportEl.getBoundingClientRect();
  return {x:(wx-cam.x)*cam.k + r.left, y:(wy-cam.y)*cam.k + r.top};
}
function screenToWorld(cx,cy){
  const r=viewportEl.getBoundingClientRect();
  return {x:cam.x+(cx-r.left)/cam.k, y:cam.y+(cy-r.top)/cam.k};
}

   3. 引擎：tick（NPC 走真实路径）+ 认知写入
   ========================================================================== */
const bld=id=>BLD.find(b=>b.id===id), npc=id=>NPC.find(n=>n.id===id);
function sched(id,m){const s=SCRIPT[id];if(!s)return{loc:"home1",act:"在家"};
  let cur={loc:s[s.length-1][1],act:s[s.length-1][2]};
  for(const [t,l,a] of s) if(m>=t) cur={loc:l,act:a};
  return cur;}
function interiorPoint(b,idx){  // 建筑内一个稳定的落脚点
  const it=(ITEMDEF[b.id]||[])[idx%Math.max(1,(ITEMDEF[b.id]||[]).length)];
  const lx=it?it.lx:0.5, ly=it?it.ly:0.6;
  return {x:b.x+b.w*lx, y:b.y+b.h*Math.max(0,ly-0.16)};
}
const nbFind=(pl,it)=>ME.notebook.find(n=>n.place===pl&&n.item===it);
let surprise=null;
function see(place){
  const t=TRUTH[place]; if(!t) return;
  const row=nbFind(place,t.item), old=row?{...row}:null;
  const fresh={place,item:t.item,value:t.price,prec:5,source:"B",day:today,by:"",chain:0};
  if(row) Object.assign(row,fresh); else ME.notebook.push(fresh);
  if(old&&old.prec>=3&&old.source!=="A"&&Math.abs(old.value-t.price)>0.001)
    surprise={place,item:t.item,was:old,now:t.price};
}
const myPrice=()=>TRUTH.shop.price;
function ledgerAdd(who,item,qty,price,wasOut){
  ME.ledger.push({day:today,min:Math.round(now),npc:who,item,qty,price,clerk:wasOut});
  ME.money+=qty*price; ME.moneyToday+=qty*price;
  const n=npc(who); if(n&&!n.known) n.known=true;
}
function metabolism(m){
  ME.hunger=Math.max(0,ME.hunger-m*.000135);
  ME.energy=Math.max(0,ME.energy-m*.000095);
  ME.bladder=Math.max(0,ME.bladder-m*.000075);
}
function rollDay(){
  now-=MIN; today++;
  ME.showed.delete(today); ME.clerk.delete(today);
  ME.hunger=Math.min(1,ME.hunger+.34); ME.energy=Math.min(1,ME.energy+.62);
  ME.moneyToday=0;
  for(const e of PRICE_EVENTS) if(e.day===today) TRUTH[e.place].price=e.price;
}
/* 一次推进 mins 分钟：NPC 按日程换目的地并走真实路径；玩家沿路径走 */
function step(mins){
  const before=now; now+=mins;
  for(const n of NPC) if(n.hesit>0) n.hesit-=mins;    // 门口犹豫计时
  // NPC
  for(const n of NPC){
    const sc=sched(n.id,now);
    if(n.at!==sc.loc){                        // 换地点 → 重新寻路
      const was=n.at; n.at=sc.loc;
      const b=bld(sc.loc);
      const dest=interiorPoint(b, NPC.indexOf(n));
      if(n.x==null){ n.x=dest.x; n.y=dest.y; }
      n.path=findPath(n.x,n.y,dest.x,dest.y); n.pi=0;
      // 进我的店 → 落账（我或孙妍）
      if(sc.loc==="shop"&&was!=="shop"&&!n.clerk){
        // ★ 声誉在世界上演: 熟客直接进门; 生人先在门口犹豫一下(头顶冒 ?)
        if(!n.known) n.hesit=12;
        if(n.known||Math.random()>.55)
          ledgerAdd(n.id,TRUTH.shop.item,n.id==="n_li"?1:2,myPrice(),ME.inside!=="shop");
      }
      if(n.known&&sc.loc==="shop"&&ME.inside==="shop"&&n.x!=null) n.face=ME.x>n.x?1:-1;
    }
    advanceOnPath(n, PX_PER_GAMEMIN*mins);
  }
  // 玩家沿路径走
  advanceOnPath(ME, PX_PER_GAMEMIN*mins, ()=>{ if(ME.arrive){ const f=ME.arrive; ME.arrive=null; f(); } });
  // 进/出建筑：人在楼里就是"在里面"
  const cur=inBldAt(ME.x,ME.y);
  const target=cur?cur.id:null;
  if(target!==ME.inside){
    ME.inside=target;
    if(target&&TRUTH[target]) see(target);     // 走进去 = 亲眼看见
    refreshPlates();                           // 知识等级可能变了 → 地图重画
  }
  metabolism(mins);
  while(now>=MIN) rollDay();
  // ★ 自动生理（需求②）：很饿 → 自己走到货架、吃掉
  if(CFG.autoPhys&&!ME.autoBusy&&ME.hunger>.86){
    const g=itemEls.get("goods_apple");
    if(g){
      ME.autoBusy=true;
      const pos={x:g.b.x+g.b.w*g.it.lx, y:g.b.y+g.b.h*g.it.ly};
      preempt(mkTask({t:"eat", icon:"eat", label:"去吃点东西", x:pos.x, y:pos.y}));
    }
  }
  // 进度：走路的进度 = 剩余路程 / 总路程
  if(ME.act){
    if(ME.act.t==="use"){
      // ★ 分数必须夹在【剩余进度】里：不然最后一步会冲过头,
      //   实际效果超过设定值（10 分钟的上厕所给出 12 分钟的量）
      const frac=Math.min(mins/Math.max(1,ME.act.mins), 1-ME.act.prog);
      ME.act.prog=Math.min(1,ME.act.prog+frac);
      // 按比例给效果（一边走进度条一边恢复, 比"最后一下跳"自然）
      if(ME.act.amt) ME[ME.act.afford]=Math.max(0,Math.min(1,
        ME[ME.act.afford]+ME.act.amt*frac));
      if(ME.act.prog>=1) finishTask(ME.act);
    } else if(ME.act.t==="eat"){
      ME.act.prog=Math.min(1,ME.act.prog+mins/90);
      if(ME.act.prog>=1){ ME.hunger=Math.max(0,ME.hunger-.62); ME.autoBusy=false; finishTask(ME.act); }
    } else if(ME.path&&ME.pi<ME.path.length-1){
      ME.act.prog=Math.min(1,1-pathLen(ME.path,ME.pi)/ME.act.total);
    }
  }
}
/* 沿路径走 dist 像素（一次可以吃掉多个拐点） */
function advanceOnPath(o, dist, onArrive){
  o.walking=false;
  if(!o.path||o.pi>=o.path.length-1) return;
  let budget=dist;
  while(budget>0 && o.pi<o.path.length-1){
    const q=o.path[o.pi+1];
    const d=Math.hypot(q.x-o.x,q.y-o.y);
    if(d<=budget){ o.x=q.x; o.y=q.y; o.pi++; budget-=d; }
    else { o.x+=(q.x-o.x)/d*budget; o.y+=(q.y-o.y)/d*budget;
           if(Math.abs(q.x-o.x)>.5) o.face=q.x>o.x?1:-1; budget=0; }
  }
  o.walking=o.pi<o.path.length-1;
  if(!o.walking){ o.path=null; if(onArrive) onArrive(); }
}

/* 快进 = 跳到（下一个开门时刻）。★ 用倒计时，不拿绝对目标（会死循环） */
function ff(){
  const from=now;
  const left0=(now<SHOP_OPEN)?(SHOP_OPEN-now):(MIN-now)+SHOP_OPEN;
  let left=Math.min(left0,2*MIN);
  const l0=ME.ledger.length;
  let guard=0;
  while(left>0&&guard++<3000){
    const chunk=Math.min(10,left); step(chunk); left-=chunk;
  }
  const missed=ME.ledger.length-l0;
  setSpeed(0);
  showSummary(from,missed);
}

/* ★ 精度 = 区间宽度。越不确定 → 带越宽；低档干脆不给数字（形状自己会说话） */
const BAND=[44,44,38,26,14,4];           // prec 0..5 对应带宽(px)
const TRACK=46, PMAX=10;                 // 轨道 46px 代表 0..10 块
function priceViz(v,prec){
  const w=BAND[Math.max(0,Math.min(5,prec))];
  const cx=Math.min(1,Math.max(0,v/PMAX))*TRACK;
  const x=Math.max(0,Math.min(TRACK-w,cx-w/2));
  const noNum = prec<=3;                 // 低于 4 档就不给确定的数字了
  const num = Math.abs(v-Math.round(v))<1e-6 ? Math.round(v) : v.toFixed(1);
  return `<span class="pv p${prec}" title="${moneyWord(v,prec)}">`
    + `<span class="tr"><i style="left:${x.toFixed(1)}px;width:${w}px"></i></span>`
    + (noNum ? `<span class="approx">≈</span>` : `<b>${num}</b>`)
    + `</span>`;
}

function knowLevel(bid){
  const b=bld(bid);
  if(!b) return 2;
  if(b.kind==="home") return 2;                    // 谁家是常识
  const rows=ME.notebook.filter(n=>n.place===bid);
  if(!rows.length) return 0;
  return Math.min(...rows.map(r=>today-r.day))<=1 ? 2 : 1;
}
/* 建筑外壳的【知识等级】用去饱和表达（在 #world 里，随地图缩放没问题）。
   名牌的【内容】交给 syncLabels（在屏幕空间，文字永远 1:1）。 */
function refreshPlates(){
  for(const b of BLD){
    const el=bldEls.get(b.id); if(!el) continue;
    const lv=knowLevel(b.id);
    el.className="bld"+(b.mine?" mine":"")+(b.kind==="home"?" home":"")
                 +(b.kind==="factory"?" factory":"")+" lv"+lv;
    const h=labEls.get("plate:"+b.id); if(h) h.sig=null;   // 逼下一帧重画名牌内容

}
/* ★ 标注层：名牌 / 人名 / 需求徽章 / 交互气泡
   每帧按需【建 / 改 / 删】，位置用 w2s 投影。文字永远 1:1 → 放大不会糊。 */
const labEls=new Map();
/* 每种标注的【居中锚点】。位置和锚点必须写进同一条内联 transform，
   否则后写的会覆盖先写的。 */
const ANCHOR={ lplate:"0%", lname:"-100%", lbadge:"-100%", bub:"-100%" };
function place(el,cls,x,y){
  el.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`
                    +` translate(-50%,${ANCHOR[cls]||"0%"})`;
}
function labelHost(key,cls){
  let h=labEls.get(key);
  if(!h){ const el=document.createElement("div"); labelsEl.appendChild(el);
          h={el,sig:null}; labEls.set(key,h); }
  if(cls&&h.el.className!==cls) h.el.className=cls;
  return h;
}
function syncLabels(){
  const want=new Set(), showName=cam.k>=0.7;
  // 建筑名牌
  for(const b of BLD){
    const key="plate:"+b.id, h=labelHost(key,"lplate"); want.add(key);
    const lv=knowLevel(b.id), rows=ME.notebook.filter(n=>n.place===b.id);
    const sig=lv+"|"+b.n+"|"+rows.map(r=>r.value+"@"+r.prec).join(",");
    if(h.sig!==sig){ h.sig=sig;
      h.el.className="lplate";
      h.el.innerHTML='<div class="plate lv'+lv+'"><span class="nm">'+b.n+'</span>'
        + (rows.length ? rows.map(r=>" "+priceViz(r.value,r.prec)).join("")
                       : '<span class="nodata"></span>')+'</div>';   // 空轨道 = 这条我没有
    }
    const q=w2s(b.x+b.w/2, b.y+b.h+4); place(h.el,"lplate",q.x,q.y);
  }
  // 人物名牌 + 需求徽章
  for(const n of NPC){
    const vis=(n.x!=null)&&canSee(n);
    if(vis&&showName&&n.known){
      const key="name:"+n.id, h=labelHost(key,"lname"); want.add(key);
      if(h.sig!==n.name){ h.sig=n.name; h.el.innerHTML=`<span class="nm">${n.name}</span>`; }
      const q=w2s(n.x,n.y); place(h.el,"lname",q.x,q.y-20);
    }
    if(vis){
      const need=(n.hesit>0)?"hesit":needOf(n);
      if(need){
        const key="badge:"+n.id, h=labelHost(key,"lbadge"); want.add(key);
        if(h.sig!==need){ h.sig=need;
          h.el.className="lbadge badge"+(need==="hesit"?" hesit":"");
          h.el.innerHTML=need==="hesit"?HESIT_SVG:(NEEDSVG[need]||""); }
        const q=w2s(n.x,n.y); place(h.el,"lbadge",q.x,q.y-38);
      }
    }
  }
  // 交互气泡
  if(bubble&&bubble._ax!=null){
    want.add("bubble:x");
    const h=labelHost("bubble:x","bub");
    h.el.className="bub"; h.el.innerHTML=bubble._html;
    h.el._ax=bubble._ax; h.el._ay=bubble._ay;
    const q=w2s(bubble._ax,bubble._ay); place(h.el,"bub",q.x,q.y);
    bubble._view=h.el;
  }
  for(const [k,h] of labEls) if(!want.has(k)){ h.el.remove(); labEls.delete(k); }
}
/* ⟦占位⟧ 人物形象 —— 现在是 SVG 画的头+身体+头发（见 ui-spec §8-人物）
   美术交付后，把这里换成 <img src="assets/people/..."> 即可，其余不动。
   要求：锚点在【脚底】，画布 18×24（@1x），4 向 + 走 4 帧 × 站 1 帧。 */
function personSVG(n,isMe){
  const body=isMe?"#b4552d":(n.top||"#7a8f6a");
  const hair=n.hair||"#3a3128";

  return `<svg width="18" height="24" viewBox="0 0 18 24">

    <circle cx="9" cy="9" r="4.2" fill="${skin}"/>
    <path d="M3.6 7.6a5.4 5.4 0 0 1 10.8 0z" fill="${hair}"/>

}
function personEl(n,isMe){

/* 静态层：地面/路/树/车/建筑外壳/室内/物品 —— 只建一次 */
let bldEls=new Map(), itemEls=new Map(), personEls=new Map(), meEl=null, pathEl=null, qEl=null;
let _seed=20260921; const rnd=()=>(_seed=(_seed*1103515245+12345)&0x7fffffff)/0x7fffffff;

(function buildStatic(){

/* 每帧：位置、朝向、LOD、昼夜、气泡跟随 */
function paintWorld(){
  // 玩家
  meEl.style.left=ME.x+"px"; meEl.style.top=ME.y+"px";
  meEl.style.transform=`translate(-50%,-88%) scaleX(${ME.face||1})`;
  // NPC
  for(const n of NPC){
    const d=personEls.get(n.id); if(!d) continue;
    if(n.x==null || !canSee(n)){ d.style.display="none"; continue; }
    d.style.display="";
    d.style.left=n.x+"px"; d.style.top=n.y+"px";
    d.style.transform=`translate(-50%,-88%) scaleX(${n.face||1})`;
  }
  // 人物名牌 / 需求徽章 / 建筑名牌 / 气泡 —— 全在屏幕空间标注层，见 syncLabels
  // ★ 队列在地图上 = 带编号的路点（你能"看见自己的一天"）
  if(qEl){
    let qh="";
    if(ME.act)
      qh+=`<div class="qmark now" style="left:${ME.act.x}px;top:${ME.act.y}px"
             title="${ME.act.label}">●</div>`;
    ME.queue.forEach((t,i)=>{
      qh+=`<div class="qmark" style="left:${t.x}px;top:${t.y}px"
             title="${t.label}">${i+1}</div>`;
    });
    qEl.innerHTML=qh;
  }
  // 导航路径
  if(pathEl){
    pathEl.innerHTML = (CFG.showPath&&ME.path&&ME.path.length>1&&ME.walking)
      ? ME.path.slice(ME.pi).filter((_,i)=>i%2===0)
          .map(p=>`<i style="left:${p.x}px;top:${p.y}px"></i>`).join("")
      : "";
  }
  // 屋顶 LOD：人在里面 + 相机拉近 → 屋顶淡出
  for(const b of BLD){
    const el=bldEls.get(b.id); if(!el) continue;
    const roof=el.querySelector(".roof");
    if(!roof) continue;                        // 保险: 一帧抛异常 = 整个渲染循环死掉
    const inside = b.open && ME.inside===b.id;
    // 相机越近越透明：k>=0.95 全透明, k<=0.55 不透明
    const prox = Math.min(1,Math.max(0,(cam.k-0.55)/0.4));
    roof.style.opacity = inside ? (1-prox).toFixed(2) : "1";
  }
  // 昼夜
  const h=now/60;
  const night=h<5?1:h<7?(7-h)/2:h<17?0:h<20?(h-17)/3:1;
  document.getElementById("night").style.opacity=(night*0.55).toFixed(2);
  document.body.classList.toggle("night",night>0.45);
  document.getElementById("rain").className=weather().k==="小雨"?"on":"";
  // 物品标签 LOD：缩太小就整体不画（跟名牌同理，别留一团糊字）
  const off = cam.k < 0.6;
  for(const [,rec] of itemEls){
    const has = rec.el.className.indexOf("lbl-off") >= 0;
    if(off && !has) rec.el.className += " lbl-off";
    else if(!off && has) rec.el.className = rec.el.className.replace(" lbl-off","");
  }
  syncLabels();
}

/* ==========================================================================
   5. 交互：点地面走路 / 点目标出气泡（世界坐标锚定）
   ========================================================================== */
/* 直接改路径（内部用）—— 玩家的点击走 queueGoto，不走这里 */
function walkTo(px,py,arrive){
  const p=findPath(ME.x,ME.y,px,py);
  ME.path=p; ME.pi=0; ME.arrive=arrive||null;
  if(p.length){ ME.tx=px; ME.ty=py; ME.face=px>ME.x?1:-1; }
}
/* 玩家的"点哪走哪" = 排队一个 goto */
function queueGoto(px,py,label,front){
  const task=mkTask({t:"goto",icon:"walk",label:label||"走过去",x:px,y:py});
  pushTask(task,front);
  return task;
}
/* ★ 用家里的东西：不在家 → 先排"回家"，再排"用它"。队列自动串起来。
   在 → 直接用它。这就是"点一下，角色自己去做完"。 */
function useHomeItem(itemId){
  const spec=HOME_USE[itemId]; if(!spec) return;
  const b=bld("home0"), p=b?interiorPoint(b,0):null;
  if(!p) return;
  if(ME.inside!=="home0") queueGoto(p.x,p.y,"回家");
  pushTask(mkTask(Object.assign({},spec,{x:p.x,y:p.y,itemId})));
  closeSheet();
}
/* 一键回家 */
function goHome(){
  const b=bld("home0"); if(!b) return;
  const p=interiorPoint(b,0);
  queueGoto(p.x,p.y,"回家");
  closeSheet();
}
/* 笔记本上的「我想再确认一下」→ 排一条确认任务 */
function queueConfirm(place,item){
  const b=bld(place); if(!b) return;
  const row=ME.notebook.find(n=>n.place===place&&n.item===item);
  if(row) row.todo=true;
  const p=interiorPoint(b,0);
  pushTask(mkTask({t:"confirm",icon:"eye",label:`确认 ${item} 的价`,
                   x:p.x,y:p.y,place,item}));
  refreshPlates(); updateHUD(); openInfo("nb");     // 留在笔记本上, 能看到它变成"已排队"
}
/* ★ 踩过的坑: 曾经用 viewportEl.setPointerCapture() —— 指针被捕获后, 后续的
   click 事件目标是 viewport, 所以物品/建筑/NPC 的 onclick 全都不会触发。
   正确做法: 不用捕获, 移动/抬起挂在 window 上; 而且【不依赖 click】——
   在 pointerup 里自己 hit-test (elementFromPoint + [data-t]) 再派发。
   这样点击/拖动/穿透三层只有一个真相。 */
let drag={on:false,moved:0,x:0,y:0};
function targetAt(cx,cy){
  const el=document.elementFromPoint(cx,cy);
  if(!el) return null;
  if(el.closest(".bub")) return {t:"bubble"};       // 气泡里的按钮走自己的 onclick
  const h=el.closest("[data-t]");
  return h ? {t:h.dataset.t, id:h.dataset.id, host:h.dataset.host||null} : null;
}
viewportEl.addEventListener("pointerdown",e=>{
  if(e.button!==0) return;
  drag.on=true; drag.moved=0; drag.x=e.clientX; drag.y=e.clientY;
});
window.addEventListener("pointermove",e=>{
  if(!drag.on) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved+=Math.abs(dx)+Math.abs(dy);
  cam.x-=dx/cam.k; cam.y-=dy/cam.k; camClamp(); camApply();
  drag.x=e.clientX; drag.y=e.clientY;
});
window.addEventListener("pointerup",e=>{
  if(!drag.on) return;
  const wasDrag=drag.moved>6; drag.on=false;
  if(wasDrag) return;
  const hit=targetAt(e.clientX,e.clientY);
  if(hit && hit.t==="bubble") return;               // 让按钮自己处理
  if(hit && hit.t==="npc"){ closeBubble(); openPerson(hit.id); return; }
  if(hit && hit.t==="item"){ openBubble("item",hit.id,hit.host); return; }
  if(hit && hit.t==="bld"){ openBubble("bld",hit.id); return; }
  if(hit && hit.t==="qmark"){ cancelAct(); return; }   // 点地图上的队列标记 = 取消它
  closeBubble();
  const w=screenToWorld(e.clientX,e.clientY);
  queueGoto(w.x,w.y,"走到这里",e.shiftKey);          // ★ 点 = 排队; Shift+点 = 插队
});
viewportEl.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=viewportEl.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const wx=cam.x+px/cam.k, wy=cam.y+py/cam.k;
  cam.k=Math.min(2.4,Math.max(.42,cam.k*Math.exp(-e.deltaY*0.0016)));
  cam.x=wx-px/cam.k; cam.y=wy-py/cam.k; camClamp(); camApply();
},{passive:false});
window.addEventListener("resize",()=>{camClamp();camApply();});

/* ── 交互气泡（需求⑤）────────────────────────────────────────────
   两个闸门:
     ① 到不到得了 → 太远就只给"走过去"（不隔空）
     ② 是不是我的 / 知不知道 → 信息只给我记的那个（带来源与时间）
   ──────────────────────────────────────────────────────────────── */
let bubble=null;
function closeBubble(){
  if(!bubble) return;
  const h=labEls.get("bubble:x");
  if(h){ h.el.remove(); labEls.delete("bubble:x"); }
  bubble=null;
}
const near=(x,y,r=110)=>Math.hypot(ME.x-x,ME.y-y)<r;
function openBubble(kind,id,hostId){
  closeBubble();
  let ax,ay,title,sub,info="",acts="",why="";
  if(kind==="item"){
    const rec=itemEls.get(id); if(!rec) return;
    const {b,it}=rec;
    ax=b.x+b.w*it.lx; ay=b.y+b.h*it.ly-it.h/2;
    const mine=b.mine, here=ME.inside===b.id, reach=near(ax,ay);
    title=it.n; sub=`${b.n} · ${it.type==="goods"?"货":"家具"}`;
    const mineRow=ME.notebook.find(n=>n.place===b.id);
    info = mineRow
      ? `<div class="r"><span>${srcIcon(mineRow.source)} 我记得</span>
             <span>${priceViz(mineRow.value,mineRow.prec)}</span></div>
         <div class="r"><span></span><span class="dim">${mineRow.day===today?"今天":today-mineRow.day+" 天前"}</span></div>`
      : `<div class="r dim">对它没印象 —— 走过去看看</div>`;
    // 两个闸门: ① 到不到得了(reach) ② 是不是我的/知不知道
    const A=[];
    if(mine&&it.type==="goods")            A.push(["改价",reach],["补货",reach],["看销量",true]);
    else if(!mine&&it.type==="goods")      A.push(["买 1 份",reach&&here],["记住这个价",reach]);
    else if(it.afford)                     A.push(["用",reach]);
    else                                   A.push(["看看",true]);
    acts=A.map(([t,on])=>`<button ${on?"":"disabled"}
        onclick="doAct('${kind}','${id}','${t}')">${t}</button>`).join("");
    if(!reach) why="你离得太远 —— 先走过去。";
    else if(!mine&&it.type==="goods"&&!here) why="得走进店里才买得了。";
  } else {
    const b=bld(id); ax=b.x+b.w/2; ay=b.y-6;
    title=b.n; sub=b.mine?"你的店":(b.kind==="home"?"住宅":"别人的店");
    const rows=ME.notebook.filter(n=>n.place===b.id);
    info = rows.length
      ? rows.map(r=>`<div class="r"><span>${srcIcon(r.source)} ${r.item}</span>
           <span>${priceViz(r.value,r.prec)}</span></div>
         <div class="r"><span></span><span class="dim">${r.day===today?"今天":today-r.day+" 天前"}</span></div>`).join("")
      : `<div class="r dim">你还没进去过 —— 里面卖什么不知道</div>`;
    acts=`<button onclick="doAct('bld','${id}','走进去')">走进去</button>`
        + (b.mine?`<button onclick="doAct('bld','${id}','管理')">公司管理</button>`:"");
  }
  bubble={_ax:ax, _ay:ay-10, _html:`<div class="t">${title}</div><div class="sub">${sub}</div>
    <div class="info">${info}</div>
    <div class="acts">${acts}</div>${why?`<div class="why">${why}</div>`:""}`, _view:null};
  paintWorld();                       // syncLabels 会把它挂进标注层并投影
}
function doAct(kind,id,what){
  if(kind==="bld"){
    if(what==="管理"){ closeBubble(); openCompany(); return; }
    const b=bld(id);
    // 有室内的 → 走到屋里; 实心的 → 只能走到门口
    const p = b.open ? interiorPoint(b,0)
                     : {x:DOOR[b.id], y:b.y+b.h+CELL*1.6};
    queueGoto(p.x,p.y,"走去 "+b.n);
  } else {
    const rec=itemEls.get(id); const b=rec.b, it=rec.it;
    if(what==="买 1 份"){
      const n=ME; n.money-=it.price; n.moneyToday-=it.price;
      ME.ledger.push({day:today,min:Math.round(now),npc:"me",item:it.n,qty:1,price:it.price,clerk:false});
      updateHUD(); return;
    }
    if(what==="记住这个价"){
      const row=ME.notebook.find(x=>x.place===b.id&&x.item===it.n);
      const f={place:b.id,item:it.n,value:it.price,prec:5,source:"B",day:today,by:"",chain:0};
      if(row) Object.assign(row,f); else ME.notebook.push(f);
      refreshPlates(); updateHUD(); closeBubble(); return;
    }
    if(what==="看销量"){ closeBubble(); openInfo("ld"); return; }
    if(what==="用"){ closeBubble(); return; }
    if(what==="改价"||what==="补货"){ closeBubble(); openCompany(); return; }
  }
  closeBubble();
}

const SLOTS=["slot1","slot2","slot3"];
function snap(){
  return {v:1, today, now, cfg:CFG,
    me:{name:ME.name,x:ME.x,y:ME.y,money:ME.money,hunger:ME.hunger,energy:ME.energy,bladder:ME.bladder,
        inside:ME.inside,myPrice:ME.myPrice},
    notebook:ME.notebook, ledger:ME.ledger, asks:ME.asks,
    act:ME.act, queue:ME.queue,
    truth:JSON.parse(JSON.stringify(TRUTH)),
    known:NPC.map(n=>({id:n.id,known:n.known}))};
}
function loadSnap(s){
  today=s.today; now=s.now;
  Object.assign(CFG,{autoPhys:true,showPath:true},s.cfg||{});
  document.documentElement.style.setProperty("--ui",CFG.uiScale);
  if(s.me.name) ME.name=s.me.name;
  Object.assign(ME,{x:s.me.x,y:s.me.y,money:s.me.money,hunger:s.me.hunger,
    energy:s.me.energy,bladder:s.me.bladder,inside:s.me.inside,myPrice:s.me.myPrice});
  ME.notebook=s.notebook; ME.ledger=s.ledger; ME.asks=s.asks;
  ME.act=s.act||null; ME.queue=s.queue||[]; ME.flash=[];
  ME.path=null; ME.arrive=null; _actSig=null;
  Object.assign(TRUTH,s.truth);
  for(const k of s.known){ const n=npc(k.id); if(n) n.known=k.known; }
  closeBubble(); closeSheet(); camCenterOn(ME.x,ME.y); updateHUD(); paintWorld();
}
function saveSlot(i){
  try{ localStorage.setItem(SLOTS[i],JSON.stringify(snap()));
    alert(`已保存到槽位 ${i+1}`); }catch(err){ alert("保存失败: "+err.message); }
}
function loadSlot(i){
  const raw=localStorage.getItem(SLOTS[i]);
  if(!raw){ alert(`槽位 ${i+1} 是空的`); return; }
  loadSnap(JSON.parse(raw));
}
function slotInfo(i){
  const raw=localStorage.getItem(SLOTS[i]);
  if(!raw) return "空";
  try{ const s=JSON.parse(raw); return `第 ${s.today} 天 ${clockStr(s.now)} · ¥${s.me.money.toFixed(0)}`;
  }catch(e){ return "损坏"; }
}
function openSave(){
  openSheet("存档","3 个本地槽位 · 也可导出成文件",
    `<button onclick="openSettings()">显示</button><button class="on" onclick="openSave()">存档</button>`,
    SLOTS.map((s,i)=>`<div class="slot"><span class="t">槽位 ${i+1} — ${slotInfo(i)}</span>
        <button onclick="saveSlot(${i})">保存</button>
        <button onclick="loadSlot(${i})">读取</button>
        <button onclick="localStorage.removeItem('${s}');openSave()">清除</button></div>`).join("")
    +`<div class="hr"></div>
      <div class="acts">
        <button onclick="exportSave()">导出 JSON</button>
        <button onclick="document.getElementById('fileIn').click()">导入 JSON</button>
        <input id="fileIn" type="file" accept=".json" style="display:none" onchange="importSave(this)">
      </div>
      <div class="dim" style="font-size:11px;margin-top:9px">
        存档里包括: 时间 · 钱 · 身体 · 笔记本 · 账本 · 问过的话 · 世界的价 · 谁认识你</div>`,true);
}
function exportSave(){
  const b=new Blob([JSON.stringify(snap(),null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`citysim-d${today}-${clockStr(now).replace(":","")}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
function importSave(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadSnap(JSON.parse(r.result)); }catch(e){ alert("读不了: "+e.message); } };
  r.readAsText(f);
}

function notebookHTML(){

  if(!rows.length) return `<div class="dim">还没有任何情报。</div>`;
  let h="";

    h+=`<div class="nb ${n.chain?"hearsay":""} ${ageClass(n.day)}">

        <span class="when">${n.age===0?"今天":n.age+" 天前"}</span></div>
      <div class="val">${priceViz(n.value,n.prec)}</div>
      <div class="src">${srcIcon(n.source)}${n.by?" "+n.by:""}</div>
      ${n.chain?`<div class="chain">~ 他也是听来的（传了 ${n.chain} 手）</div>`:""}
      <div class="todo ${n.todo?"on":""}" onclick="queueConfirm('${n.place}','${n.item}')">
        ${n.todo?"☑ 已排进队列":"☐ 我想再确认一下"}</div></div>`;
  return `<div class="dim" style="font-size:12px;margin-bottom:12px">
    这是你自己的记忆。世界在变，它不会跟着变 —— 想更新，就得去看或去问。</div>`+h;
}
/* 账本 —— 不用表格。
   每一行 → 变成一个"人"（常客墙）；每一笔 → 变成一张"小票"。
   要读的信息全塞进【亮度 / 条长 / 虚实】，数字只留"来过几次"和钱。
   精确值（几点、上次几天前、共花多少）保留在 hover 里 —— 语义不丢。 */
function ledgerHTML(){
  const by={};
  for(const e of ME.ledger){
    if(e.npc==="me") continue;
    // ★ last 初值必须是 -Infinity 而不是 0: 开局之前的历史是负日子,
    //   用 0 会把「13 天没来」夹成「3 天」——常客墙就全亮成一片了
    (by[e.npc]=by[e.npc]||{n:0,last:-Infinity,spent:0}).n++;
    by[e.npc].last=Math.max(by[e.npc].last,e.day);
    by[e.npc].spent+=e.qty*e.price;
  }
  // 还来的排前面；不来的自动沉到右边、变灰
  const regs=Object.entries(by).map(([id,v])=>({id,...v,ago:today-v.last}))
    .sort((a,b)=>a.ago-b.ago);
  const t=ME.ledger.filter(e=>e.day===today);
  const sum=t.reduce((a,e)=>a+e.qty*e.price,0);

  let h=`<h4 class="sec">常客墙 <span class="dim" style="font-weight:400">· 越靠右越久没来</span></h4>`;
  if(!regs.length) h+=`<div class="empty-row"></div>`;
  else {
    h+=`<div class="regs">`;
    for(const r of regs){
      const n=npc(r.id)||{name:"某居民",known:false};
      const lvl = r.ago<=0?0 : r.ago<=2?1 : r.ago<=6?2 : 3;
      const heat= Math.max(6,Math.round(100*(1-Math.min(1,r.ago/14))));
      h+=`<div class="reg" data-lvl="${lvl}" onclick="openPerson('${r.id}')"
            title="${n.known?n.name:"某居民"} · 来过 ${r.n} 次 · 上次 ${r.ago===0?"今天":r.ago+" 天前"} · 共 ¥${r.spent.toFixed(0)}">
        ${r.ago===0?'<span class="today"></span>':""}
        <div class="face">${miniPerson(n)}</div>
        <div class="nm">${n.known?n.name:"某居民"}</div>
        <div class="heat"><i style="width:${heat}%"></i></div>
        <div class="n">${r.n}<span>次</span></div>
      </div>`;
    }
    h+=`</div>`;
  }

  h+=`<h4 class="sec">今天 <span class="dim" style="font-weight:400">· 虚线 = 我不在场</span></h4>`;
  if(!t.length) h+=`<div class="empty-row"></div>`;
  else {
    h+=`<div class="flows">`;
    for(const e of t){
      const n=e.npc==="me"?{name:"我",top:"#b4552d",hair:"#3a3128"}:npc(e.npc);
      h+=`<div class="trade ${e.clerk?"away":""}"
            title="${clockStr(e.min)} · ${n.name} 买了 ${e.item}×${e.qty} · ¥${(e.qty*e.price).toFixed(1)}${e.clerk?" · 我不在":""}">
        <span class="mini">${miniPerson(n)}</span>${e.item}×${e.qty}
      </div>`;
    }
    h+=`</div><div class="sumline">今天进账 <b>¥${sum.toFixed(0)}</b></div>`;
  }
  return h;
}
/* ⟦占位⟧ 小头像（面板里用）—— 与世界上的人物共用同一套配色维度 */
function miniPerson(n){
  const top=(n&&n.top)||"#9a9488", hair=(n&&n.hair)||"#3a3128";

    <circle cx="9" cy="7.5" r="5.4" fill="${hair}"/>

}
function peopleHTML(){

  }
  h+=`<h4 class="sec">打听</h4><div class="acts">
      <button onclick="doAsk('${id}','price')">问价</button>

  if(asked.length){
    h+=`<h4 class="sec">我以前问过他</h4>`;
    for(const a of asked.slice().reverse())
      h+=`<div class="nb ${a.chain?"hearsay":""}">

        ${a.chain?`<div class="chain">~ 他也只是听来的</div>`:""}</div>`;
  }
  return h;
}
function doAsk(id,topic){
  const n=npc(id),box=document.getElementById("askout"); if(!box) return;
  const askedToday=ME.asks.filter(a=>a.npc===id&&a.day===today).length;
  if(askedToday>=3){ box.innerHTML=`<div class="bubble"><div class="say">“啊这个我刚说过吧。”</div>
    <div class="evid"><span>心情</span><span>烦了 —— 今天不再回答你</span></div></div>`; return; }
  let text,evid,chain=0,label="";
  if(!n.known){ text="……你谁啊？"; evid="他不认识你"; label="搭话"; }
  else if(topic==="price"){
    label="苹果多少钱？";
    if(Math.random()<n.hearseP*.55){ text="好像是四块多吧，记不太清了";
      evid="他没亲眼看见 · 别人说的 · 模糊"; chain=1; }
    else { text="苹果啊？我上礼拜看是五块"; evid="他上次亲眼看到 · 3 天前 · 较清楚"; }
  } else if(topic==="other"){
    label="街角水果铺怎么样？";
    if(Math.random()<.5){ text="水果铺最近好像涨了，不太确定";
      evid="他没亲眼看见 · 别人说的 · 模糊"; chain=1; }
    else { text="水果铺？梨挺便宜的，三块五吧"; evid="他记得的 · 2 天前 · 一位"; }
  } else { label="闲聊"; text="今天天气不错啊"; evid="闲聊（没有信息）"; }
  ME.asks.push({npc:id,day:today,topic:label,text,evid,chain});
  box.innerHTML=`<div class="bubble"><div class="say">“${text}”</div>
    <div class="evid"><span>来源</span><span>${evid}</span>
      ${chain?`<span>转手</span><span class="warn">他也是听来的 —— 别当准的用</span>`:""}</div>
    <div class="dim" style="margin-top:8px;font-size:11px">→ 已记进笔记本 <span class="tag">自动</span></div></div>`;
  const place=topic==="other"?"fruit":"shop", item=topic==="other"?"梨":"苹果";
  const val=topic==="other"?TRUTH.fruit.price:TRUTH.shop.price;
  const row=ME.notebook.find(x=>x.place===place&&x.item===item);
  const f={place,item,value:val,prec:chain?3:4,source:"C",day:today,by:n.name,chain:chain?2:1};
  if(row&&row.source!=="A") Object.assign(row,f); else ME.notebook.push(f);
  updateHUD();
}
function shopHTML(){
  const last7=[]; for(let d=today-6;d<=today;d++) last7.push({d,me:ME.showed.has(d),cl:ME.clerk.has(d)});
  const payday=Math.ceil((today+1)/7)*7;
  const goods=(ITEMDEF.shop||[]).filter(i=>i.type==="goods");
  return `<h4 class="sec">货架</h4><table><tr><th>货</th><th>定价</th><th>库存</th><th></th></tr>
    ${goods.map(i=>`<tr><td>${i.n}</td><td class="num">¥${i.price.toFixed(1)}</td>
      <td class="num">${i.stock}</td>
      <td><button style="padding:2px 9px;border:1px solid var(--line);border-radius:999px"
        onclick="closeSheet();walkTo(${bld('shop').x+bld('shop').w*i.lx},${bld('shop').y+bld('shop').h*i.ly})">去货架</button></td></tr>`).join("")}
    </table>
  <h4 class="sec">账</h4><div class="card">
    <div class="kv"><span class="k">现金</span><b>¥${ME.money.toFixed(0)}</b></div>
    <div class="kv"><span class="k">今天</span>
      <span class="${ME.moneyToday>=0?"":"bad"}">${ME.moneyToday>=0?"+":""}¥${ME.moneyToday.toFixed(0)}</span></div>
    <div class="hr"></div>
    <div class="kv"><span class="k">下次发薪</span><span>第 <b>${payday}</b> 天 08:00</span></div>
    <div class="kv"><span class="k"></span><span class="warn">还差 ¥112 —— 按现在这个速度不够</span></div></div>
  <h4 class="sec">今天</h4><div class="card">
    <label style="display:block;margin-bottom:6px">
      <input type="radio" name="who" ${!ME.clerk.has(today)?"checked":""} onchange="beAtShop()"> 今天我在店里站柜台</label>
    <label style="display:block">
      <input type="radio" name="who" ${ME.clerk.has(today)?"checked":""} onchange="letClerk()"> 今天我出门 <span class="dim">（让 孙妍 顶班）</span></label>
    <div class="hr"></div>
    <div class="dim" style="font-size:11px;margin-bottom:3px">本周谁在店里</div>
    <div class="mono" style="letter-spacing:4px">${last7.map(x=>x.me?"我":(x.cl?"员":"·")).join(" ")}</div>
    <div class="hr"></div>
    <div class="warn" style="font-size:12px">⚠ 老顾客记得的是【站柜台那个人的脸】。<br>
      ${daysSinceShown()===0?"你今天露面了。":`你已经 <b>${daysSinceShown()}</b> 天没露面了。`}</div>
  </div>`;
}
function beAtShop(){ ME.clerk.delete(today); const b=bld("shop"),p=interiorPoint(b,1); walkTo(p.x,p.y); openCompany(); }
function letClerk(){ ME.clerk.add(today); openCompany(); }

/* ── 快进摘要（故意不全）── */
function showSummary(from,missed){
  const hrs=(now-from)/60;
  const hrTxt=hrs<1?`${Math.round(hrs*60)} 分钟`:`${hrs.toFixed(1)} 小时`;
  const lines = missed>0
    ? [`有 <b>${missed}</b> 笔生意在我不在时成交 <span class="tag">账本</span>`,
       `<span class="miss">你没有看到他们。</span>`,
       `店交给孙妍了 —— 这段脸面是她的。`]
    : [`这段时间<b>没有人来过店里</b>`,`你也没在。`];
  document.body.classList.add("sum");
  document.getElementById("summary").innerHTML=`<div class="box">
    <h3>你跳到了 第 ${today} 天 ${clockStr(now)}</h3>
    <div class="dim" style="font-size:11px">跳过了 ${hrTxt}（${clockStr(from)} → ${clockStr(now)}）</div>
    <ul>${lines.map(l=>`<li>${l}</li>`).join("")}<li>你的肚子也在饿。</li></ul>
    <div class="hr"></div>
    <div class="dim" style="font-size:11px">想去看看是谁？翻账本。</div>
    <div class="acts" style="margin-top:14px">
      <button onclick="document.body.classList.remove('sum');openInfo('ld')">看账本</button>
      <button onclick="document.body.classList.remove('sum')">继续</button></div></div>`;
}

/* ==========================================================================
   7. 主循环 + 快捷键
   ========================================================================== */
/* ★ 当前动作 + 队列。只在【结构变了】才重建（不然 hover 和 ✕ 会被每帧冲掉），
   进度条每帧只改宽度。 */
let _actSig=null;
function actPaneHTML(){
  const now=performance.now();
  ME.flash=ME.flash.filter(f=>now-f.doneAt<800);
  let h="";
  if(ME.act){
    h+=`<div class="now">
      <span class="ic">${ICON[ME.act.icon]||ICON.walk}</span>
      <span class="lb">${ME.act.label}</span>
      <button class="x" title="取消" onclick="cancelAct()">✕</button></div>
      <div class="prog"><i id="actBar" style="width:${Math.round((ME.act.prog||0)*100)}%"></i></div>`;
  } else {
    h+=`<div class="none">站着</div>`;
  }
  const list=ME.flash.concat(ME.queue);
  if(list.length){
    h+=`<div class="queue"><div class="qh">排队 ${ME.queue.length}</div>`;
    list.forEach((t,i)=>{
      const isFlash=t.done;
      const isNext=!isFlash && i===ME.flash.length;
      h+=`<div class="qi ${isFlash?"done":""} ${isNext?"next":""}">
        <span class="no">${isFlash?"✓":(i-ME.flash.length+1)}</span>
        <span class="ic">${ICON[t.icon]||ICON.walk}</span>
        <span class="lb">${t.label}</span>
        ${isFlash?"":`<button class="x" title="从队列删掉" onclick="dropTask('${t.id}')">✕</button>`}
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}
function updateActPane(){
  const el=document.getElementById("actWrap"); if(!el) return;
  const flashSig = ME.flash.length ? "f"+Math.floor(performance.now()/200) : "-";
  const sig=(ME.act?ME.act.id+"|"+(ME.act.icon):"-")+"|"+
            ME.queue.map(t=>t.id).join(",")+"|"+ME.flash.map(f=>f.id).join(",")+"|"+flashSig;
  if(sig!==_actSig){ _actSig=sig; el.innerHTML=actPaneHTML(); }
  const bar=document.getElementById("actBar");
  if(bar&&ME.act) bar.style.width=Math.round((ME.act.prog||0)*100)+"%";
}
function setSpeed(v){
  speed=v; if(v>0) prevSpeed=v;
  const c=document.getElementById("paneTime"); if(c) c.innerHTML=timeBarHTML();
}
function paint(){
  updateHUD(); paintWorld();
  const s=document.getElementById("surprise");
  if(surprise){
    const k=surprise;
    s.style.display="block";
    s.innerHTML=`<div class="t">咦？和你记得的不一样</div>
      <div><b>${k.item}</b> · ${bname(k.place)}</div>
      <div class="was">你记的是 <s>${moneyWord(k.was.value,k.was.prec)}</s>
        （${today-k.was.day} 天前 · ${k.was.source==="B"?"亲眼":"打听"}）</div>
      <div style="font-weight:700">现在看到的是 ¥${k.now.toFixed(1)}</div>
      <div class="dim" style="font-size:11px;margin-top:5px">→ 笔记本已更新为「今天 · 亲眼」</div>`;
    surprise=null;
    clearTimeout(paint._t);
    paint._t=setTimeout(()=>{const el=document.getElementById("surprise");
      if(el) el.style.display="none";},7000);
  }
  const nl=document.getElementById("nowline");
  if(nl&&openerId){
    const sc=sched(openerId,now);
    nl.innerHTML=(ME.inside===sc.loc)
      ?`在 <b>${bname(sc.loc)}</b> · ${sc.act} ${srcTag({source:"B"})}`
      :`<span class="dim">你不在那儿 —— 他现在在干什么，你不知道。</span>`;
  }
}
let lastReal=performance.now(), acc=0;
function loop(ts){
  const dt=Math.min((ts-lastReal)/1000,.25); lastReal=ts;
  if(speed>0){
    let left=dt*60*speed;
    while(left>0){ const s=Math.min(3,left); step(s); left-=s; }
    if(ME.walking&&!drag.on) camCenterOn(ME.x,ME.y);   // 只在走路时跟随（拖动时不抢镜头）
  }
  // 帧率上限
  acc+=dt;
  const minDt=CFG.fpsCap>=240?0:1/CFG.fpsCap;
  if(minDt===0||acc>=minDt){ acc=0; paint(); }
  requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeSheet(); closeBubble(); document.body.classList.remove("sum"); }
  if((e.key==="x"||e.key==="X")&&!document.body.classList.contains("open")){ cancelAct(); }
  if(e.key===" "&&!document.body.classList.contains("open")){
    e.preventDefault(); setSpeed(speed>0?0:prevSpeed);
  }
});
buildHUD(); updateHUD();
camCenterOn(ME.x,ME.y);
paintWorld();
requestAnimationFrame(loop);
</script>
