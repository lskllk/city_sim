<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>CitySim · M5 观察器</title>
<link rel="stylesheet" href="style.css?v=6"/>
</head>
<body>
<header id="topbar">
  <span class="stat" id="clock">Day 1 00:00</span>
  <span class="btnrow" id="speedbar">
    <button data-speed="pause">⏸</button>
    <button data-speed="1x">1x</button>
    <button data-speed="10x">10x</button>
    <button data-speed="100x">100x</button>
    <button data-speed="1000x">1000x</button>
  </span>
  <span class="btnrow">
    <span id="sceneName" class="stat">榆树巷 · 一个街区</span>
    seed <input id="seed" type="number" value="3" min="1" max="999"/>
    KB <select id="kb_mode"><option value="off">off</option>
        <option value="full" selected>full</option></select>
    <button id="resetBtn">重开</button>
  </span>
  <span class="status" id="conn">● 连接中</span>
</header>
<main id="layout">
  <div id="canvasWrap"><canvas id="stage"></canvas></div>
  <div id="inspHandle" title="拖动调整宽度"></div>
  <aside id="inspector">
    <div id="inspTitle">点一个小人查看</div>
    <div id="tabs" class="tabs">
      <button data-tab="status" class="active">状态</button>
      <button data-tab="why">为什么</button>
      <button data-tab="kb">知识</button>
      <button data-tab="events">事件</button>
    </div>
    <div id="panel" class="panel"></div>
  </aside>
</main>
<footer id="evbar">
  <span class="btnrow">
    事件流
    <button data-filter="all" class="active">全部</button>
    <button data-filter="decision">决策</button>
    <button data-filter="told">传闻</button>
    <button data-filter="intent_failed">失败</button>
    <button data-filter="interaction_done">完成</button>
  </span>
  <ul id="events"></ul>
</footer>
<script src="kbgraph.js?v=6"></script>
<script src="render/layout.js?v=6"></script>
<script src="render/camera.js?v=6"></script>
<script src="render/fx.js?v=6"></script>
<script src="render/vm.js?v=6"></script>
<script src="render/painter.js?v=6"></script>
<script src="render/picker.js?v=6"></script>
<script src="render.js?v=6"></script>
<script src="panels.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
