<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>citysim</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ 地图视口（铺满整个窗口）══════════════════════════════════════════ -->
<div id="viewport"><canvas id="stage"></canvas></div>
<div id="labels"></div>

<!-- ══ 游戏：四角 HUD ══════════════════════════════════════════════════ -->
<div id="hud">
  <div class="pane tl" id="paneMe">
    <div class="me-name" id="meName">镇上的小店</div>
    <div class="me-money" id="meMoney">—<span class="d">元</span></div>
    <div class="bars" id="meBars"></div>
    <div class="hr"></div>
    <div id="meAct" class="dim" style="font-size:11px">点一个人看看</div>
  </div>

  <div class="pane tc">
    <span class="day" id="gDay">第 1 天</span>
    <span class="sep"></span>
    <span class="clock mono" id="gClock">--:--</span>
    <span class="sep"></span>
    <span class="wx" id="gWx">☀ 晴</span>
  </div>

  <div class="tr">
    <button class="entry" id="gHome"><span class="ic">⌂</span>我的店</button>
    <button class="entry" id="gMenu"><span class="ic">←</span>菜单</button>
  </div>

  <div class="bc" id="gSpeed"></div>
</div>

<aside id="panel" class="hide"></aside>
<div id="hint"></div>

<!-- ══ 编辑器：同一套四角 ══════════════════════════════════════════════ -->
<div id="editor" class="hide">
  <div id="ecanvaswrap"><canvas id="ecanvas"></canvas></div>
  <div id="elabels"></div>

  <div id="ehud">
    <!-- 顶上只留场景信息 —— 别的一律下移 -->
    <div class="pane tc" id="eTop">
      <span class="modes" id="eModes">
        <button data-mode="map" class="on">地图</button>
        <button data-mode="people">人物</button>
        <button data-mode="building">建筑</button>
      </span>
      <span class="sep"></span>
      <span class="day"><b id="eName" class="mono">—</b><span id="eDirty" class="bad"></span></span>
      <span class="sep"></span>
      <span class="dim" id="eStats">—</span>
      <span class="sep"></span>
      <span id="eXY" class="mono"></span>
      <span id="eSnapLabel" class="dim"></span>
      <span class="sep"></span>
      <span id="eUndo" class="mono dim"></span>
      <span id="eVer" class="mono" style="font-size:10px;color:#c8c1b2"></span>
    </div>

    <div class="tr">
      <button class="entry" id="eSave"><span class="ic">⌘</span>保存</button>
      <button class="entry" id="eSaveAs">另存为…</button>
      <button class="entry" id="eMenu"><span class="ic">←</span>菜单</button>
    </div>
  </div>

  <!-- ★ 人物设计：左边一个【固定高度】的名单，右边是编辑框。
       人物数据本来就在场景里（scene.npcs），所以它属于场景编辑器，不是另开一个。 -->
  <div id="ePeople" class="hide">
    <aside class="pane plist">
      <div class="phead"><b>城里的人</b><span class="dim" id="pCount"></span>
        <button id="pAdd">+ 新增</button></div>
      <div class="plist-body" id="pList"></div>
    </aside>
    <section class="pane pform" id="pForm"></section>
  </div>

  <!-- ★ 建筑编辑：和人物一个样子（左名单 + 右详情）。
       建筑【没有"新增"】—— 房子是在地图上摆的，这里只编辑。 -->
  <div id="eBld" class="hide">
    <aside class="pane plist">
      <div class="phead"><b>城里的建筑</b><span class="dim" id="bCount"></span></div>
      <div class="plist-body" id="bList"></div>
    </aside>
    <section class="pane pform" id="bForm"></section>
  </div>

  <!-- ★ 摆放栏：上下两排。
       上排 = 操作 + 资产类型 + 栅格；下排 = 当前 tab 的资产，横着铺开。 -->
  <div id="eplace" data-mode="map">
    <div class="r1">
      <div class="sect seg" id="eTool">
        <button data-tool="select">选择 1</button>
        <button data-tool="erase">删除 2</button>
      </div>
      <div class="sect tabs" id="eTabs">
        <button data-cat="bld" class="on">建筑</button>
        <button data-cat="road">道路</button>
        <button data-cat="env">环境</button>
        <button data-cat="area">地面区域</button>
      </div>
      <div class="sect snaprow">
        <label class="on" id="eSnapNet"><input type="checkbox" checked>吸附</label>
        <label class="on" id="eSnapGrid"><input type="checkbox" checked>栅格</label>
        <span class="sz"><input id="eGridSize" type="number" min="1" step="1" value="4">m</span>
      </div>
    </div>
    <div class="r2"><div class="sect row" id="ePalette"></div></div>
  </div>
</div>

<!-- ══ 弹框（★ 必须在 body 顶层）════════════════════════════════════════
     不能塞进 .pform 里 —— .pform{position:fixed;z-index:20} 会建立层叠上下文，
     弹框写 z-index:40 也只在它内部有效；而蒙布 #popVeil 挂在 body 上、z-index 39，
     跟 .pform(20) 一比就赢了 → 蒙布盖在弹框上面：悬浮不高亮、点也点不动。
     踩过的坑：程序化 .click() 能穿过遮挡物，所以测试全绿、用鼠标的人却在骂。 -->
<div class="facepop hide" id="bItemPop"></div>
<div class="facepop hide" id="thingPop"></div>

<!-- ══ 主菜单 ══════════════════════════════════════════════════════════ -->
<div id="menu">
  <div class="card">
    <h1>citysim</h1>
    <p class="sub">一个小镇 · 一家店 · 一群记得你的人</p>
    <nav>
      <button class="entry primary" id="mContinue">
        <b>继续</b><span id="mLast">最近一次的场景</span></button>
      <button class="entry" id="mNew">
        <b>新场景</b><span>画一张新地图 —— 空白开始，进编辑器</span></button>
      <button class="entry" id="mOpen">
        <b>打开场景</b><span>从 config/scenes/ 里挑一个</span></button>
      <button class="entry" id="mEditor">
        <b>编辑器</b><span id="mEditorHint">打开最近编辑的那张</span></button>
    </nav>
  </div>

  <!-- 场景列表：点「打开场景」才展开 -->
  <div class="card hide" id="mList">
    <div class="listhead">config/scenes/ <button class="x" id="mListClose">✕</button></div>
    <div id="mListBody"></div>
  </div>

  <div class="status" id="mStatus">没连后端（点「继续」会连）</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
